# Bedtime: Pixel 8 plugged in after 21:00 / before 06:45.
#
# Turns the loft floor off, then leaves the stairs LED strip on as a
# dim red night light. The floor turn_off includes the stairs, so the
# red turn_on has to be the last action or the strip stays off.
#
# The Pixel 8 wall charger reports sensor.pixel_8_charger_type "ac",
# not "usb". Both are triggers, plus the Pixel plugged_in event.
#
# Other iDeal strips are only switched off (TURN packet) so a later
# bare LoftC3 turn_on can resume their DIY. The stairs strip is the
# exception: red at 3% paints over that strip's DIY. idealLED cannot
# read or replay DIY (https://github.com/8none1/idealLED).
#
# The red only sticks with the locally patched
# custom_components/ideal_led/light.py. Upstream skips a colour that
# matches its cache, so after the first night it only sent power-on
# and the strip resumed its bright moving pattern.
#
# Plugging in makes the charger sensors flap (ac -> none -> usb -> ac,
# plus is_charging) within seconds. Each flap re-ran this and turned
# the stairs back on after a manual off. The 5-minute cooldown makes
# one plug-in one run.
id: "1757876570945"
alias: Loft lights off Pixel charge
description: >-
  After 21:00 (or before 06:45), plugging in the Pixel 8 turns loft
  lights off and sets the stairs strip to red at 3%. Runs at most once
  per 5 minutes so charger-sensor flaps don't undo a manual off.
mode: single
triggers:
  - trigger: state
    entity_id:
      - sensor.pixel_8_charger_type
    to:
      - ac
      - usb
  - trigger: device
    domain: binary_sensor
    device_id: c5e32dc81cd7d30327bbd97e043130a6
    entity_id: 217f7dc54440c50ac6de93445bc1bd46
    type: plugged_in
    for:
      hours: 0
      minutes: 0
      seconds: 3
conditions:
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > 300 }}
  - condition: or
    conditions:
      - condition: time
        after: "21:00:00"
      - condition: time
        before: "06:45:00"
        weekday:
          - sun
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
actions:
  - action: light.turn_off
    target:
      floor_id: loft_floor
  - action: light.turn_off
    target:
      entity_id:
        - light.loft_lights
        - light.isp_1a3c38_3c38
  - action: light.turn_on
    target:
      entity_id: light.isp_0db21e_b21e
    data:
      brightness_pct: 3
      rgb_color:
        - 255
        - 0
        - 0
