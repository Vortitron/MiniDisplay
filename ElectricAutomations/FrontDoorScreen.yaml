# Saga door display brightness.
#
# Since 16 Oct 2026 the Saga's screen stays on: Chrome shows the camera page
# (SagaCam/) with the front-door dashboard inside it, and the camera needs
# the page visible. So brightness does the job Fully's screen on/off did, and
# keeps the charger ahead of the drain:
#
#                                   by day   after sunset
#   idle                              10          1
#   sensor.door_message non-empty    150         60
#   FrontPath person (for a minute)  150         60
#
# Re-applied at sunset and sunrise. Needs the HA app's "Modify system
# settings" permission on the Saga, and auto brightness off
# (command_auto_screen_brightness: turn_off, sent once on 16 Oct).
#
# sensor.door_message is a UI template helper, source in
# door_message_template.jinja.
#
# Deployed with ha_set_automation, id front_door_screen (2026-10-16).
id: front_door_screen
alias: Front door screen
description: >-
  Saga door display brightness (the screen stays on, holding the camera page
  and the front-door dashboard, so brightness replaces Fully's screen on/off
  and keeps the charger ahead). Idle: 10 by day, 1 after sunset. A door
  message or a FrontPath detection (for a minute): 150 by day, 60 after
  sunset. Re-applied at sunset and sunrise. Uses the HA app's
  command_screen_brightness_level (0-255).
mode: restart
triggers:
  - trigger: template
    value_template: "{{ states('sensor.door_message') not in ['', 'unknown', 'unavailable'] }}"
    id: message
  - trigger: template
    value_template: "{{ states('sensor.door_message') in ['', 'unknown', 'unavailable'] }}"
    id: message
  - trigger: homeassistant
    event: start
    id: message
  - trigger: sun
    event: sunset
    id: message
  - trigger: sun
    event: sunrise
    id: message
  - trigger: state
    entity_id: binary_sensor.frontpath_ble_processing_path_person_detected
    from: "off"
    to: "on"
    id: visitor
variables:
  dark: "{{ is_state('sun.sun', 'below_horizon') }}"
  bright: "{{ 60 if dark else 150 }}"
  idle: "{{ 1 if dark else 10 }}"
actions:
  - if:
      - condition: trigger
        id: visitor
    then:
      - action: notify.mobile_app_saga
        data:
          message: command_screen_brightness_level
          data:
            command: "{{ bright }}"
      - delay:
          seconds: 60
  - action: notify.mobile_app_saga
    data:
      message: command_screen_brightness_level
      data:
        command: >-
          {{ bright if states('sensor.door_message') not in ['', 'unknown', 'unavailable'] else idle }}
