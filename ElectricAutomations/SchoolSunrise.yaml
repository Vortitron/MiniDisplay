# School-morning sunrise in the loft (19 Oct 2026).
#
# The loft Kajplats and (from 20 Oct) the living-room one (white spectrum,
# 2202-6535 K, they do transitions) rise for Andy's 06:50 alarm: from 06:30
# (first step sent 06:29), 1% at their warmest (2202 K) to 100% at 4000 K by
# 06:50, a step a minute (21 steps) with the bulb's own 60 s transition so it
# looks continuous. Brightness follows the square of the time, slow at first
# like a real dawn. At 06:50 they are left on.
#
# School day: either child's InfoMentor "today schedule" says has_school for
# today's date (Isolde's preschool counts: 08:00 starts either way). If
# InfoMentor has nothing for today, input_boolean.school_day (set at 19:00
# the evening before by automation "School Day") decides.
#
# Each light is on its own: one already on at 06:29 is left out, and one
# turned off or dimmed below the ramp drops out (the others carry on).
#
# Deployed with ha_set_automation, id school_sunrise (19 Oct; 06:30 start
# and the living room 20 Oct).
id: school_sunrise
alias: School morning sunrise
description: >-
  On school days (InfoMentor today schedule, else input_boolean.school_day)
  the loft Kajplats and the living-room Kajplats rise 06:30-06:50 for the
  alarm: 1% at 2202 K to 100% at 4000 K, a step a minute with 60 s
  transitions. A light already on is left out; one turned off or dimmed drops
  out.
mode: single
triggers:
  - trigger: time
    at: "06:29:00"
variables:
  all_lights:
    - light.kajplats_e14_ws_globe_806lm     # North spot kajplats (loft)
    - light.loft_desk_kajplats              # South Spot KAJPLATS (loft)
    - light.kajplats_e14_ws_globe_806lm_2   # Living Room Spot Kajplats
  steps: 20
  k_from: 2202
  k_to: 4000
conditions:
  - condition: template
    value_template: >-
      {% set today = now().date() | string %}
      {% set kids = ['sensor.lyeklint_hancock_felix_today_schedule_2',
                     'sensor.lyeklint_hancock_isolde_today_schedule_2'] %}
      {% set known = kids | select('is_state_attr', 'date', today) | list %}
      {% if known | count > 0 %}
        {{ known | select('is_state_attr', 'has_school', true) | list | count > 0 }}
      {% else %}
        {{ is_state('input_boolean.school_day', 'on') }}
      {% endif %}
actions:
  - variables:
      start_off: "{{ all_lights | reject('is_state', 'on') | list }}"
  - condition: template
    value_template: "{{ start_off | count > 0 }}"
  - repeat:
      sequence:
        - variables:
            frac: "{{ (repeat.index - 1) / steps }}"
            pct: "{{ [1, (100 * frac ** 2) | round(0) | int] | max }}"
            prev_pct: "{{ [1, (100 * ([repeat.index - 2, 0] | max / steps) ** 2) | round(0) | int] | max }}"
            kelvin: "{{ (k_from + (k_to - k_from) * frac) | round(0) | int }}"
            # Still ours: first step, or on and not dimmed below the last step.
            active: >-
              {% set ns = namespace(l=[]) %}
              {% for e in start_off %}
                {% if repeat.index == 1
                      or (is_state(e, 'on')
                          and (state_attr(e, 'brightness') | int(0)) >= prev_pct * 2.55 - 8) %}
                  {% set ns.l = ns.l + [e] %}
                {% endif %}
              {% endfor %}
              {{ ns.l }}
        - condition: template
          value_template: "{{ active | count > 0 }}"
        - action: light.turn_on
          target:
            entity_id: "{{ active }}"
          data:
            brightness_pct: "{{ pct }}"
            color_temp_kelvin: "{{ kelvin }}"
            transition: 60
        - delay:
            seconds: 60
      until:
        - condition: template
          value_template: "{{ repeat.index > steps }}"
