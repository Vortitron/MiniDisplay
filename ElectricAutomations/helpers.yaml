# Home Assistant helper entities for the Sam HVAC, Hot Water, and Thermal Model automations.
#
# Paste each top-level section (input_number:, input_datetime:, input_text:, input_boolean:, input_button:, input_select:)
# into your configuration.yaml. If you already have one of these top-level keys defined,
# merge the child entries into it rather than duplicating the key.
#
# Alternatively, save this file as /config/packages/automations_helpers.yaml and enable
# packages in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages

input_number:
  # ---- Sam HVAC control ---------------------------------------------------
  sam_control_temperature:
    name: Sam Control Temperature
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermostat

  sam_desired_temperature:
    name: Sam Desired Temperature
    min: 10
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer

  # ---- House thermal model ------------------------------------------------
  # NB: k, h and tau deliberately have NO `initial:`. These are values the
  # House Thermal Model automation LEARNS (EMA, alpha 0.05 — many hours of
  # valid samples to converge). An `initial:` makes HA overwrite them with the
  # default at every restart: k was 0.168 on 27 Aug 2026 and back at exactly
  # 0.2 after the 3 Sep restart. Without it they restore from the last state.
  house_heat_loss_k:
    name: House Heat Loss Coefficient (k)
    min: 0
    max: 3
    step: 0.0001
    unit_of_measurement: "1/h"
    icon: mdi:snowflake-thermometer

  house_heat_rate:
    name: Sam Heating Rate (h)
    min: 0
    max: 30
    step: 0.001
    unit_of_measurement: "°C/h"
    icon: mdi:fire

  house_thermal_tau:
    name: House Thermal Time Constant
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: "h"
    icon: mdi:clock-outline

  thermal_last_inside:
    name: Thermal Model Last Inside Temp
    min: -50
    max: 50
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:history

  thermal_last_outside:
    name: Thermal Model Last Outside Temp
    min: -50
    max: 50
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:history

  hours_to_evening_target:
    name: Hours to Reach Evening Target
    min: 0
    max: 24
    step: 0.01
    unit_of_measurement: "h"
    icon: mdi:clock-time-eight-outline

  forecast_outside_4h:
    name: Forecast Outside Temperature (next 4h avg)
    min: -50
    max: 50
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:weather-partly-cloudy

  # ---- Hot water reheat tracking -----------------------------------------
  hot_water_reheat_minutes_remaining:
    name: Hot Water Reheat Minutes Remaining
    min: 0
    max: 240
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  # ---- Pool pump (15 000 L pool, ~5000 L/h pump) -------------------------
  pool_pump_turnover_minutes:
    name: Pool Pump Turnover Minutes
    min: 60
    max: 360
    step: 15
    unit_of_measurement: "min"
    icon: mdi:pool
    initial: 180

  pool_pump_minutes_remaining:
    name: Pool Pump Minutes Remaining
    min: 0
    max: 360
    step: 15
    unit_of_measurement: "min"
    icon: mdi:timer-sand
    initial: 0

  pool_cheap_rank_max:
    name: Pool Cheap Rank Max
    min: 0
    max: 23
    step: 1
    icon: mdi:cash-clock
    initial: 5

  pool_pump_extended_hours:
    name: Pool Pump Extended Hours
    min: 1
    max: 12
    step: 1
    unit_of_measurement: "h"
    icon: mdi:clock-outline
    initial: 6

  # ---- Lily cat feed counter (KitchenDetectorer Button 7) -----------------
  # NB: was wrongly declared under input_boolean: (with min/max/step, which
  # booleans do not support) — it is a counter, so it lives here instead.
  lily_pouch_count:
    name: Lily Pouch Count
    min: 0
    max: 20
    step: 0.5
    icon: mdi:cat
    initial: 0

input_datetime:
  # ---- Hot water ----------------------------------------------------------
  hot_water_manual_override_until:
    name: Hot Water Manual Override Until
    has_date: true
    has_time: true

  # ---- Pool pump ----------------------------------------------------------
  pool_pump_plan_until:
    name: Pool Pump Plan Until
    has_date: true
    has_time: true

  # ---- House thermal model ------------------------------------------------
  # NB: k, h and tau deliberately have NO `initial:`. These are values the
  # House Thermal Model automation LEARNS (EMA, alpha 0.05 — many hours of
  # valid samples to converge). An `initial:` makes HA overwrite them with the
  # default at every restart: k was 0.168 on 27 Aug 2026 and back at exactly
  # 0.2 after the 3 Sep restart. Without it they restore from the last state.
  thermal_last_sample:
    name: Thermal Model Last Sample
    has_date: true
    has_time: true

  # ---- Lily cat feed (KitchenDetectorer Button 7) -------------------------
  lily_last_feed:
    name: Lily Last Feed
    has_date: true
    has_time: true
    icon: mdi:cat

  # ---- Sam Superchill (blast cool) ----------------------------------------
  sam_superchill_until:
    name: Sam Superchill Until
    has_date: true
    has_time: true
    icon: mdi:timer-snow

input_text:
  sam_hvac_status:
    name: Sam HVAC Status
    max: 255

  # Short plan reason (DaytimeCheapHeat) — why desired/control are set.
  sam_hvac_reason:
    name: Sam HVAC Reason
    max: 48
    initial: Daytime economy 16°C

  # Headline for dashboards / MiniDisplay screensaver (reason · action).
  sam_hvac_headline:
    name: Sam HVAC Headline
    max: 64

  # Pre-warm decision maths (DaytimeCheapHeat) — k, h, forecast, skip/boost why.
  sam_preheat_calc:
    name: Sam Preheat Calculation
    max: 255

  house_thermal_status:
    name: House Thermal Model Status
    max: 255

  pool_pump_status:
    name: Pool Pump Status
    max: 255
    initial: Idle

  # ---- Feed-swap light restore (FeedSwapLightRestore.yaml) ---------------
  # input_text.light_state_snapshot, input_text.light_restore_pending and
  # input_button.restore_lights_to_snapshot are STORAGE helpers, created live
  # over MCP (as input_text.spot_daily_avg_history and .loft_stairs_restore
  # are). They are deliberately NOT declared here: an id declared in both
  # places fights for the same entity registry slot at restart. Recreate with
  #   input_text  Light State Snapshot        max 255, icon mdi:camera-timer
  #   input_text  Light Restore Pending       max 255, icon mdi:progress-clock
  #   input_button Restore Lights To Snapshot icon mdi:lightbulb-auto
  # No `initial:` on the snapshot - it must survive a restart, and an initial
  # would wipe it exactly when a restart follows a power cut.

input_boolean:
  holiday_mode:
    name: Holiday Mode
    icon: mdi:palm-tree

  hot_water_notified:
    name: Hot Water Notified
    icon: mdi:water-alert

  daytime_cheap_7_21:
    name: Daytime Cheap 7-21
    icon: mdi:cash-clock

  sam_superchill_active:
    name: Sam Superchill Active
    icon: mdi:snowflake-variant

input_button:
  # ---- Hot water ----------------------------------------------------------
  hot_water_boost_2h:
    name: Hot Water Boost (2h)
    icon: mdi:water-boiler-auto

  # ---- Sam Superchill (blast cool for 2h) ---------------------------------
  sam_superchill_2h:
    name: Sam Superchill (2h)
    icon: mdi:snowflake-alert

  sam_superchill_stop:
    name: Sam Superchill Stop
    icon: mdi:snowflake-off

  # ---- Pool pump (smart_plug_4 — heater + 5000 L/h pump) ------------------
  pool_pump_schedule_cheap:
    name: Pool — Cheap Windows
    icon: mdi:cash-clock

  pool_pump_run_extended:
    name: Pool — Extended Run
    icon: mdi:pool

  pool_pump_stop:
    name: Pool — Stop
    icon: mdi:stop-circle

input_select:
  pool_pump_mode:
    name: Pool Pump Plan
    options:
      - off
      - cheap
      - extended
    icon: mdi:pool

template:
  - sensor:
      - name: Lily Time Since Feed
        unique_id: lily_time_since_feed
        icon: mdi:cat
        state: >-
          {% set dt = states('input_datetime.lily_last_feed') %}
          {% if dt in ['unknown', 'unavailable', ''] or dt.startswith('1970') %}
            --
          {% else %}
            {% set delta = (now() - as_datetime(dt)).total_seconds() | int(0) %}
            {% if delta < 0 %}
              --
            {% else %}
              {{ (delta // 3600) | int }}:{{ '%02d' | format((delta % 3600) // 60) }}
            {% endif %}
          {% endif %}
