# A Saga still for every FrontPath "Path Person Detected", for labelling the
# radar rule's hits (person / cat / nothing). Photos land in
# /config/frontpath_snapshots/<YYYYmmdd-HHMMSS>.jpg, where the Vome config-file
# tools can read them back for review (/media is out of their reach; the
# folder is in allowlist_external_dirs, and not under www, so it is not
# served without a login). frontpath_snapshot_cleanup keeps a week. And a
# logbook line names the photo and the gates that set the rule off, from
# sensor ..._path_trigger ("S3 43/12" = street radar gate 3, peak 43 against
# a normal of 12). No notification: automation.front_door_snapshot (off until
# detection is trusted) is the one that messages the Pixel. Unlike that one,
# this does not touch the porch light: switching it off after the photo
# would cut the light the path-lights automation has just raised for a
# real arrival.
#
# Deployed with ha_set_automation, id frontpath_trigger_snapshot (2026-10-15).

id: frontpath_trigger_snapshot
alias: Front Path - Snapshot each detection
description: >-
  Labelling aid for the FrontPath radar rule (15 Oct): a Saga still for every
  Path Person Detected, saved to /config/frontpath_snapshots/<time>.jpg, plus a logbook
  line with the gates that set it off. No notification, and leaves the porch
  light to the path-lights automation.
mode: single
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: binary_sensor.frontpath_ble_processing_path_person_detected
    from: "off"
    to: "on"
actions:
  - variables:
      stamp: "{{ now().strftime('%Y%m%d-%H%M%S') }}"
      why: "{{ states('sensor.front_walkway_frontpath_ble_processing_path_trigger') }}"
      screen_was_off: "{{ is_state('switch.saga_screen', 'off') }}"
  - if:
      - condition: template
        value_template: "{{ screen_was_off }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.saga_screen
      - delay:
          seconds: 2
  - action: switch.turn_on
    target:
      entity_id: switch.saga_motion_detection
  - delay:
      seconds: 4
  - action: camera.snapshot
    continue_on_error: true
    target:
      entity_id: camera.saga
    data:
      filename: "/config/frontpath_snapshots/{{ stamp }}.jpg"
  - action: switch.turn_off
    target:
      entity_id: switch.saga_motion_detection
  - action: logbook.log
    data:
      name: FrontPath snapshot
      message: "{{ stamp }}.jpg  {{ why }}"
      entity_id: binary_sensor.frontpath_ble_processing_path_person_detected

---
# Daily clear-out. Needs, in configuration.yaml:
#   homeassistant:
#     allowlist_external_dirs:
#       - /config/frontpath_snapshots
#     media_dirs:
#       local: /media
#       frontpath: /config/frontpath_snapshots
#   shell_command:
#     frontpath_snapshot_cleanup: "find /config/frontpath_snapshots -name '*.jpg' -mtime +7 -delete"
#     frontpath_photos: "python3 /config/scripts/frontpath_photos.py"
# and the Local File integration (UI only since HA 2024; YAML is refused),
# "FrontPath latest" on /config/frontpath_snapshots/latest.jpg, which makes
# camera.frontpath_latest.
# `find` is recursive, so the gallery thumbnails in thumbs/ go with their
# photos. shell_command.frontpath_photos (SagaCam/frontpath_photos.py, run by
# saga_web_log after each saved photo) makes those thumbnails and latest.jpg.
# Deployed with ha_set_automation, id frontpath_snapshot_cleanup (2026-10-16).

id: frontpath_snapshot_cleanup
alias: Front Path - Clear old snapshots
description: >-
  Keeps a week of FrontPath detection snapshots: daily, deletes .jpg files
  older than 7 days from /config/frontpath_snapshots
  (shell_command.frontpath_snapshot_cleanup).
mode: single
triggers:
  - trigger: time
    at: "03:30:00"
actions:
  - action: shell_command.frontpath_snapshot_cleanup
    continue_on_error: true
