# Colour lights mimic the sunset (17 Oct 2026).
#
# White-spectrum lights (the Kajplats in the living room and loft) follow it
# as colour temperature: the same boosted colour converted to kelvin
# (sRGB -> CIE xy -> McCamy), clamped to the bulb's range, so a neutral sky
# is 6500 K, 17 Oct's warm one ~4100 K and a blue one the bulb's coolest.
# From sunset they fade to their warmest over the 20 min, ending fully warm,
# with the bulb's own 25 s transitions. (They list xy as a colour mode but
# are white-only bulbs, so they are named, not detected.)
#
# From an hour before sunset each light fades up towards max_pct, reaching it
# at sunset, in the colour the FrontPath VEML6040 sees outside. Every 30 s
# until 20 min after sunset; the lights are left on.
#
# Never dims: each step sets the higher of the ramp and the light's own
# brightness, so a light already at 50% stays at 50% while the ramp is below
# it, and a light someone turns up mid-way carries on from there. Lights
# already on are included (their colour follows the sky too).
#
# Colour: the sensor's raw R, G, B counts are white-balanced against midday
# daylight (R/G 1.04, B/G 0.38 at noon on 16 and 17 Oct), so daylight is
# white, and then the difference from grey is multiplied by `boost`: the raw
# shift is real but small (17 Oct, half an hour before sunset: R 1.02, G 1,
# B 0.77 after balancing, a pale warm white). The box faces away from the
# sunset, so on a clear evening it sees the sky going blue rather than the
# orange glow (16 Oct: B/G rose from 0.37 to 0.49 through sunset), and on a
# hazy one it goes warm (17 Oct: 0.39 to 0.29). The lights follow either.
#
# Below 15 lx every light goes to a set warm white (its warmest kelvin:
# floods 2700 K, Kajplats 2202 K): by then what the sensor sees is mostly the
# streetlamp and FrontPath's own path lights (on at 15 lx), and near dark the
# counts are noise (0.4 lx on 17 Oct read as magenta, 249/136/255). Between
# sunset and that, colours blend towards warm (2700 K-ish 255/166/87 for the
# floods, the warmest kelvin for the Kajplats) over the 20 min after sunset.
# Going cool at the start is fine.
#
# If the bio projector is on (sensor.bio_power_power over 200 W), the bio
# flood is left out (see BioProjectorLights.yaml).
#
# A light drops out (and is left alone) when it is turned off or dimmed below
# what the script set: a BILRESA button, "Flood off on phone charge",
# SuperExpensive load shedding, a hand on the app. An unavailable light (the
# office stand, switched off at the wall) is skipped.
#
# A restart kills running scripts (it did on 17 Oct at 15:33), so the
# automation also runs at HA start inside the window; the ramp is worked out
# from the clock, so it picks up where it was.
#
# Deployed with ha_set_script (sunset_light) and ha_set_automation
# (sunset_flood).

# script.sunset_light
alias: Sunset light
description: >-
  One light follows the sunset (see automation sunset_flood): every 30 s,
  brightness = the higher of a 3% to max_pct ramp (reaching max_pct at
  set_ts) and the light's own; colour = the FrontPath sensor's,
  white-balanced and boosted (as kelvin for a white-spectrum light), drifting
  warm over the 20 min after sunset, and the light's warmest white below
  15 lx. Stops 20 min after set_ts, or when the light is turned off or dimmed
  below what it set.
mode: parallel
max: 10
fields:
  light:
    description: The light to drive.
    required: true
    selector:
      entity:
        domain: light
  set_ts:
    description: Sunset, as a Unix timestamp.
    required: true
    selector:
      number:
        min: 0
        max: 4000000000
        mode: box
  white:
    description: A white-spectrum light, driven by colour temperature.
    default: false
    selector:
      boolean: {}
variables:
  max_pct: 70
  boost: 2
sequence:
  - condition: template
    value_template: "{{ states(light) not in ['unavailable', 'unknown'] }}"
  - repeat:
      sequence:
        - variables:
            ramp: >-
              {% set frac = 1 - (set_ts - as_timestamp(now())) / 3600 %}
              {{ (3 + (max_pct - 3) * ([0, [frac, 1] | min] | max)) | round(0) | int }}
            own: >-
              {{ ((state_attr(light, 'brightness') | int(0)) / 2.55) | round(0) | int
                 if is_state(light, 'on') else 0 }}
            pct: "{{ [ramp, own] | max }}"
            lux: "{{ states('sensor.front_walkway_frontpath_ble_processing_illuminance') | float(0) }}"
            rgb: >-
              {% set r = states('sensor.front_walkway_frontpath_ble_processing_light_red') | float(0) / 1.04 %}
              {% set g = states('sensor.front_walkway_frontpath_ble_processing_light_green') | float(0) %}
              {% set b = states('sensor.front_walkway_frontpath_ble_processing_light_blue') | float(0) / 0.38 %}
              {% set m = (r + g + b) / 3 %}
              {% if m <= 0 %}[255, 255, 255]{% else %}
              {% set c = [[0, m + boost * (r - m)] | max, [0, m + boost * (g - m)] | max, [0, m + boost * (b - m)] | max] %}
              {% set top = c | max %}
              {{ [(255 * c[0] / top) | round(0) | int, (255 * c[1] / top) | round(0) | int, (255 * c[2] / top) | round(0) | int] }}
              {% endif %}
            # After sunset, the colour lights' colour drifts to a warm white.
            tint: >-
              {% set f = [0, [(as_timestamp(now()) - set_ts) / 1200, 1] | min] | max %}
              {% set w = [255, 166, 87] %}
              {{ [(rgb[0] * (1 - f) + w[0] * f) | round(0) | int,
                  (rgb[1] * (1 - f) + w[1] * f) | round(0) | int,
                  (rgb[2] * (1 - f) + w[2] * f) | round(0) | int] }}
            # The sky's kelvin until sunset (the warmest once the sensor is
            # too dark to trust), then towards the warmest. Colour lights use
            # it only in the dark, where it is always their warmest.
            kelvin: >-
              {% set kmin = state_attr(light, 'min_color_temp_kelvin') | int(2200) %}
              {% set kmax = state_attr(light, 'max_color_temp_kelvin') | int(6500) %}
              {% set sky = namespace(k=kmin) %}
              {% if lux >= 15 %}
                {% set lin = namespace(v=[]) %}
                {% for v in rgb %}{% set q = v / 255 %}{% set lin.v = lin.v + [q / 12.92 if q <= 0.04045 else ((q + 0.055) / 1.055) ** 2.4] %}{% endfor %}
                {% set X = 0.4124 * lin.v[0] + 0.3576 * lin.v[1] + 0.1805 * lin.v[2] %}
                {% set Y = 0.2126 * lin.v[0] + 0.7152 * lin.v[1] + 0.0722 * lin.v[2] %}
                {% set Z = 0.0193 * lin.v[0] + 0.1192 * lin.v[1] + 0.9505 * lin.v[2] %}
                {% set x = X / (X + Y + Z) %}{% set y = Y / (X + Y + Z) %}
                {% set n = (x - 0.3320) / (0.1858 - y) if y != 0.1858 else 10 %}
                {% set sky.k = 449 * n ** 3 + 3525 * n ** 2 + 6823.3 * n + 5520.33 %}
                {% if sky.k < 0 or sky.k > kmax %}{% set sky.k = kmax %}{% endif %}
              {% endif %}
              {% set f = [0, [(as_timestamp(now()) - set_ts) / 1200, 1] | min] | max %}
              {% set k = sky.k * (1 - f) + kmin * f %}
              {{ [kmin, [k, kmax] | min] | max | round(0) | int }}
        - if:
            - condition: template
              value_template: "{{ white }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ light }}"
              data:
                color_temp_kelvin: "{{ kelvin }}"
                brightness_pct: "{{ pct }}"
                transition: 25
        - if:
            - condition: template
              value_template: "{{ not white and lux >= 15 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ light }}"
              data:
                rgb_color: "{{ tint }}"
                brightness_pct: "{{ pct }}"
        - if:
            - condition: template
              value_template: "{{ not white and lux < 15 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ light }}"
              data:
                color_temp_kelvin: "{{ kelvin }}"
                brightness_pct: "{{ pct }}"
        - delay:
            seconds: 30
      until:
        - condition: template
          value_template: >-
            {{ as_timestamp(now()) > set_ts + 1200
               or not is_state(light, 'on')
               or (state_attr(light, 'brightness') | int(0)) < pct * 2.55 - 8 }}

---
# automation.sunset_flood
id: sunset_flood
alias: Sunset flood
description: >-
  An hour before sunset (or at HA start inside the hour before to 20 min
  after), if someone is home, starts script.sunset_light for each light:
  colour (living-room LED flood, bio flood, living office stand) and
  white-spectrum (Kajplats: living room, loft north and south). They fade up
  to 70% at sunset, never dimmer than they already are, in the colour (or
  colour temperature) the FrontPath sensor sees outside, drifting warm over
  the 20 min after sunset and a set warm white once it is dark (below 15 lx,
  streetlamp). Bio flood left out while the projector is on.
mode: single
triggers:
  - trigger: sun
    event: sunset
    offset: "-01:00:00"
  - trigger: homeassistant
    event: start
variables:
  # After sunset next_setting is tomorrow's; a day back is within a few
  # minutes of today's, near enough for the window.
  set_ts: >-
    {% set n = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
    {{ n if n - as_timestamp(now()) < 43200 else n - 86400 }}
  colour_lights:
    - light.led_flood_light
    - light.bio_floodlight
    - light.living_office_stand
  white_lights:
    - light.kajplats_e14_ws_globe_806lm_2   # Living Room Spot Kajplats
    - light.kajplats_e14_ws_globe_806lm     # North spot kajplats (loft)
    - light.loft_desk_kajplats              # South Spot KAJPLATS (loft)
conditions:
  - condition: template
    value_template: "{{ states('zone.home') | int(0) > 0 }}"
  - condition: template
    value_template: "{{ set_ts - 3660 <= as_timestamp(now()) <= set_ts + 1200 }}"
actions:
  - repeat:
      # The bio flood stays out of it while the projector is on.
      for_each: >-
        {% set all = colour_lights + white_lights %}
        {{ all | reject('eq', 'light.bio_floodlight') | list
           if states('sensor.bio_power_power') | float(0) > 200 else all }}
      sequence:
        - action: script.turn_on
          target:
            entity_id: script.sunset_light
          data:
            variables:
              light: "{{ repeat.item }}"
              set_ts: "{{ set_ts }}"
              white: "{{ repeat.item in white_lights }}"
