# Who set off the path: the Saga's verdict on each photo set (20 Oct 2026).
#
# FrontPath's Path Motion is twitchy on purpose (cats, the tree), so the
# Saga camera page photographs every Path Motion and runs an object detector
# on the photos in the browser (MediaPipe EfficientDet-Lite0, COCO classes).
# It posts what it found to webhook <hook>_seen:
#   {"tag": "detect072009", "kind": "detect", "person": 0.83,
#    "animal": "cat", "animal_score": 0.41,
#    "person_box": {"part": "b", "box": [0.41, 0.32, 0.08, 0.2]},
#    "animal_box": {...}}
# A box is where the best match was: in which photo of the set (a, b, c)
# and [left, top, width, height] as fractions of the frame (21 Oct 2026).
#
# Here: a person at 50%+ is a person. Otherwise, when it is dark (the
# detector is weak on noisy night stacks) or the score is middling
# (15-50%), the night stack photo goes to an AI vision model for a second
# opinion. Not for every set, though: on the rainy night of 20-21 Oct the
# box-adjacent radar rules fired 200 times and Claude was asked 520 times.
# A set that only the near/door rule triggered is sent at most once in ten
# minutes (input_datetime.frontpath_ai_asked); one where the person rule
# fired too (binary_sensor ..._path_person_detected within a minute), or
# the Saga scored 15%+, always goes (ai_entity below: Claude, via the Anthropic integration, from
# 20 Oct; the OpenAI account was inactive). If the call fails the Saga's
# verdict stands. The AI also says how sure it is: a "person" it is not
# sure of becomes "unsure (AI: ...)", which the gallery shows but the
# person alert leaves alone (20 Oct 23:17 it called a tree trunk by the
# fairy lights "a dark silhouette of a person", and the phone buzzed).
#
# Results: input_text.frontpath_seen ("detect072009: person 83% (Saga)"),
# input_datetime.frontpath_person_seen when it was a person, and a logbook
# line "FrontPath seen" on input_text.frontpath_seen that the gallery reads.
# The verdict ends with where the thing is, which the gallery circles:
#   "detect072009: cat 41% (Saga) [b cat 0.41,0.32,0.08,0.2]"
#   "detect221503: animal (AI: a cat on the steps) [~b animal 0.4,0.55,0.08,0.1]"
# "~" marks the AI's box: a rough guess, on the night stack (photo b).
#
# The webhook id is the Saga page's hook plus "_seen"; it is not in this
# repo (see SagaCam/README.md). Deployed with ha_set_automation, id
# frontpath_seen.
id: frontpath_seen
alias: Front Path - who is it
description: >-
  Takes the Saga camera page's detector result for each FrontPath photo set
  (webhook <hook>_seen): a person at 50%+ is a person; when dark or unsure,
  the night stack goes to an AI vision model (Claude) for a second opinion. Writes
  input_text.frontpath_seen, input_datetime.frontpath_person_seen and a
  'FrontPath seen' logbook line.
mode: queued
max: 10
triggers:
  - trigger: webhook
    webhook_id: SAGA_HOOK_seen
    allowed_methods:
      - POST
    local_only: false
variables:
  ai_entity: ai_task.claude_ai_task
  tag: "{{ trigger.json.tag | default('?') }}"
  person: "{{ trigger.json.person | default(0) | float(0) }}"
  animal: "{{ trigger.json.animal | default('') }}"
  animal_score: "{{ trigger.json.animal_score | default(0) | float(0) }}"
  # Night by the sun, or the box's light sensor under 3 lx (it read 10-12 lx
  # on an overcast morning when the camera's frames were fine: 21 Oct 08:42).
  dark: >-
    {{ is_state('sun.sun', 'below_horizon')
       or states('sensor.front_walkway_frontpath_ble_processing_illuminance') | float(0) < 3 }}
  unsure: "{{ person < 0.5 and (dark or person >= 0.15) }}"
  person_rule: >-
    {{ is_state('binary_sensor.frontpath_ble_processing_path_person_detected', 'on')
       or as_timestamp(now()) - as_timestamp(states.binary_sensor.frontpath_ble_processing_path_person_detected.last_changed, 0) < 60 }}
  box_only: >-
    {{ states('sensor.front_walkway_frontpath_ble_processing_path_motion_trigger') is match('^(near|door|rain)')
       and not person_rule }}
  ai_quiet: "{{ as_timestamp(now()) - as_timestamp(states('input_datetime.frontpath_ai_asked'), 0) > 600 }}"
  ask_ai: "{{ unsure and (person >= 0.15 or not box_only or ai_quiet) }}"
  pbox: >-
    {% set b = trigger.json.person_box if trigger.json.person_box is mapping else {} %}
    {% set n = b.get('box') if b.get('box') is sequence and b.get('box') is not string else [] %}
    {% if b.get('part') in ['a', 'b', 'c'] and n | count == 4 %}[{{ b.part }} person {{ n | map('float', 0) | map('round', 3) | join(',') }}]{% endif %}
  abox: >-
    {% set b = trigger.json.animal_box if trigger.json.animal_box is mapping else {} %}
    {% set n = b.get('box') if b.get('box') is sequence and b.get('box') is not string else [] %}
    {% if animal and b.get('part') in ['a', 'b', 'c'] and n | count == 4 %}[{{ b.part }} {{ animal }} {{ n | map('float', 0) | map('round', 3) | join(',') }}]{% endif %}
  saga_verdict: >-
    {% if person >= 0.5 %}person {{ (person * 100) | round(0) | int }}% (Saga) {{ pbox }}
    {% elif animal and animal_score >= 0.4 %}{{ animal }} {{ (animal_score * 100) | round(0) | int }}% (Saga) {{ abox }}
    {% else %}nothing (Saga, person {{ (person * 100) | round(0) | int }}%){% endif %}
actions:
  - choose:
      - conditions: "{{ ask_ai }}"
        sequence:
          # The photos are saved by saga_web_log a moment after they are sent.
          # By day the AI gets the first single frame (sharp); at night the
          # stack (8 frames added: brighter, but anything moving smears into
          # a trail, which is why a person walking up the steps at 08:42 on
          # 21 Oct came back "white cat trail").
          - wait_template: >-
              {{ (tag ~ '-b-stack') in states('input_text.frontpath_last_photos') if dark
                 else (tag ~ '-a-frame') in states('input_text.frontpath_last_photos') }}
            timeout: "00:00:20"
            continue_on_timeout: true
          - variables:
              ai_photo: >-
                {% set want = '-' ~ tag ~ ('-b-stack' if dark else '-a-frame') %}
                {% set hit = states('input_text.frontpath_last_photos').split(' ') | select('search', want) | list %}
                {{ hit[0] if hit else states('input_text.frontpath_last_stack_photo') }}
          - action: input_datetime.set_datetime
            continue_on_error: true
            target:
              entity_id: input_datetime.frontpath_ai_asked
            data:
              timestamp: "{{ as_timestamp(now()) }}"
          - action: ai_task.generate_data
            continue_on_error: true
            response_variable: ai
            data:
              task_name: frontpath person check
              entity_id: "{{ ai_entity }}"
              instructions: >-
                This photo is from a camera inside a house door, looking out
                across a patio and up garden steps towards the street.
                {% if dark %}It is night, and the photo is eight frames over
                about four seconds added together, so anything moving appears
                as a trail of repeated or smeared pale shapes, each a little
                smaller as it moves away up the steps. A white cat lives here
                and makes exactly that trail: a pale blob or streak repeated
                up the steps is the cat, not a person with a light or an
                umbrella.{% else %}It is a single frame in daylight, possibly
                dull or wet. A white cat lives here.{% endif %} Is there a
                person anywhere in it? If not, is there an animal (cat, dog,
                fox, deer, bird)? Be sceptical: tree trunks, posts, the
                railing, the garden chairs and reflections of the hallway in
                the door glass are not people; a shape is only a person if
                you can make out a head and shoulders, limbs or clothing at a
                person's size against the steps and railing. Answer verdict
                person, animal or nothing, and in 'confidence' high when you
                can clearly see it, low when you are guessing from a vague
                shape. In 'what' say in a few words what you see. If you found
                a person or animal, in 'box'
                say where it is as four numbers: left, top, width, height,
                each a fraction of the image width or height from 0 to 1
                (for example 0.40,0.55,0.08,0.12); otherwise leave 'box'
                empty.
              structure:
                verdict:
                  required: true
                  selector:
                    select:
                      options: [person, animal, nothing]
                what:
                  required: true
                  selector:
                    text: {}
                confidence:
                  required: true
                  selector:
                    select:
                      options: [high, low]
                box:
                  required: false
                  selector:
                    text: {}
              attachments:
                - media_content_id: "media-source://media_source/frontpath/{{ ai_photo }}"
                  media_content_type: image/jpeg
          - variables:
              verdict: >-
                {% set v = ai.data.verdict if ai is defined and ai.data is defined and ai.data else '' %}
                {% set n = (ai.data.get('box') or '') | string | regex_findall('[0-9]*[.]?[0-9]+') | map('float') | list if v else [] %}
                {% set sure = (ai.data.get('confidence') or 'high') != 'low' if v else true %}
                {% set what = v if sure else 'unsure' %}
                {% set aibox = '[~' ~ ('b' if dark else 'a') ~ ' ' ~ what ~ ' ' ~ (n[:4] | map('round', 2) | join(',')) ~ ']'
                   if n | count >= 4 and n[:4] | max <= 1 and n[2] > 0 and n[3] > 0 else '' %}
                {% if person >= 0.5 %}{{ saga_verdict }}
                {% elif v == 'person' and not sure %}unsure (AI: {{ ai.data.what | truncate(60) }}) {{ aibox }}
                {% elif v == 'person' %}person (AI: {{ ai.data.what | truncate(60) }}) {{ aibox }}
                {% elif v == 'animal' %}animal (AI: {{ ai.data.what | truncate(60) }}) {{ aibox }}
                {% elif v == 'nothing' %}nothing (AI, Saga person {{ (person * 100) | round(0) | int }}%)
                {% else %}{{ saga_verdict }}{% endif %}
          - action: input_text.set_value
            target:
              entity_id: input_text.frontpath_seen
            data:
              value: "{{ (tag ~ ': ' ~ verdict) | truncate(250) }}"
          - if:
              - condition: template
                value_template: "{{ verdict.startswith('person') }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.frontpath_person_seen
                data:
                  timestamp: "{{ as_timestamp(now()) }}"
          - action: logbook.log
            data:
              name: FrontPath seen
              message: "{{ tag }}: {{ verdict }}"
              entity_id: input_text.frontpath_seen
    default:
      - action: input_text.set_value
        target:
          entity_id: input_text.frontpath_seen
        data:
          value: "{{ (tag ~ ': ' ~ saga_verdict) | truncate(250) }}"
      - if:
          - condition: template
            value_template: "{{ saga_verdict.startswith('person') }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.frontpath_person_seen
            data:
              timestamp: "{{ as_timestamp(now()) }}"
      - action: logbook.log
        data:
          name: FrontPath seen
          message: "{{ tag }}: {{ saga_verdict }}"
          entity_id: input_text.frontpath_seen
