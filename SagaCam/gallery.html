<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Path Photos</title>
<!--
  Gallery of the FrontPath photos (17 Oct 2026). Served by Home Assistant from
  /config/www/saga-cam/gallery.html at /local/saga-cam/gallery.html, and shown
  in the "Path photos" dashboard (/path-photos, an iframe strategy dashboard,
  20 Oct) so the phone app and notifications open it with HA's own login.
  Browsers keep /local/ files for 31 days (HA's cache headers), so that
  dashboard's URL carries ?v=<date>; bump it when this file changes.

  The photos live in /config/frontpath_snapshots, which configuration.yaml
  adds as the media folder "frontpath". This page lists them through Home
  Assistant's websocket API (media_source/browse_media, resolve_media) with
  the login of the browser it is opened in: the Home Assistant phone app's
  (asked for the way HA's own frontend does in the app, 20 Oct), the HA
  dashboard's when shown in a card on it, the HA frontend's saved tokens
  (localStorage "hassTokens", same origin), or the Saga camera page's token.
  Nothing secret is stored in this file.

  One day at a time (Older / Newer, or the date list; the day is kept in the
  address after '#'). Cards and the strip in the large view use the 480 px
  thumbnails that scripts/frontpath_photos.py makes on the server
  (frontpath_snapshots/thumbs/); a full-size photo downloads only when it is
  opened, so it is fine on a phone away from home.

  Each detection is one card (its photos a = frame at once, b = night stack,
  c = a frame a few seconds on). The note says why it fired: the FrontPath
  Path Trigger gates at that moment (history), or "radar burst" for a test
  shot that frontpath_burst_photo took (logbook). From 20 Oct the note also
  says who the photo check found (person / cat / no one; logbook "FrontPath
  seen"; "unsure" when the AI only guessed), and the second row of buttons
  filters on it (Found = people and animals). Where the check found
  it is circled on the photos (from 21 Oct): solid for the Saga's detector,
  dashed for the AI's rough guess, only on the photo it was found in (the
  strip's thumbnail of that photo has a green border).
-->
<style>
  :root {
    --bg: #101214; --panel: #1a1d21; --line: #2c3036; --text: #e8eaed;
    --muted: #9aa0a6; --accent: #8ab4f8; --warn: #fdd663; --bad: #f28b82;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  header { padding: 14px 16px 6px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  h1 { font-size: 19px; margin: 0; }
  #status { color: var(--muted); font-size: 13px; }
  .filters, .daynav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .daynav select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
  .daynav button:disabled { opacity: .4; }
  .filters button, .daynav button, .lb button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  .filters button.on { border-color: var(--accent); color: var(--accent); }
  section { padding: 4px 16px 16px; }
  section h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 14px 0 8px;
               text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card .thumb { aspect-ratio: 4 / 3; background: #000; display: block; width: 100%; object-fit: cover; }
  .card .meta { padding: 6px 9px 8px; font-size: 13px; }
  .card .time { font-weight: 600; }
  .card .kind { color: var(--muted); }
  .card .kind.burst { color: var(--warn); }
  .card .who { font-weight: 600; }
  .card .who.person { color: #81c995; }
  .card .who.animal { color: var(--warn); }
  .card .who.none { color: var(--muted); font-weight: 400; }
  .card .who.unsure { color: var(--muted); }
  .card .why { color: var(--muted); font-size: 12px; }
  .card .pic { position: relative; overflow: hidden; }
  .mark { position: absolute; border: 2px solid #81c995; border-radius: 50%; pointer-events: none;
          box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6); }
  .mark.animal { border-color: var(--warn); }
  .mark.unsure { border-color: #aaa; }
  .mark.ai { border-style: dashed; }
  .lb .strip img.hit { border-color: #81c995; opacity: 1; }
  .lb .strip img.hit.cur { border-color: var(--accent); }
  .mark span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 2px;
               font-size: 12px; white-space: nowrap; background: rgba(0,0,0,.65); color: #fff; padding: 0 5px; border-radius: 3px; }
  #marks { position: absolute; pointer-events: none; }
  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; flex-direction: column; z-index: 5; }
  .lb.open { display: flex; }
  .lb .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
  .lb .cap { flex: 1 1 auto; min-width: 0; font-size: 14px; }
  .lb .cap small { color: var(--muted); display: block; }
  .lb .stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
  .lb .stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb .side { position: absolute; top: 0; bottom: 0; width: 18%; border: 0; background: transparent; cursor: pointer; }
  .lb .side.l { left: 0; } .lb .side.r { right: 0; }
  .lb .strip { display: flex; gap: 6px; padding: 6px 12px 12px; justify-content: center; }
  .lb .strip img { height: 56px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; opacity: .7; }
  .lb .strip img.cur { border-color: var(--accent); opacity: 1; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Front path photos</h1>
  <div class="daynav">
    <button id="older">&#8249; Older</button>
    <select id="day"></select>
    <button id="newer">Newer &#8250;</button>
  </div>
  <div class="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="detect">Detections</button>
    <button data-f="burst">Radar bursts</button>
    <button data-f="test">Tests</button>
  </div>
  <!-- Who the photo check found (automation frontpath_seen), from 20 Oct. -->
  <div class="filters who-filters">
    <button data-w="all" class="on">All</button>
    <button data-w="found">Found</button>
    <button data-w="person">People</button>
    <button data-w="animal">Animals</button>
    <button data-w="none">Nothing</button>
  </div>
  <span id="status">Connecting to Home Assistant...</span>
</header>
<main id="days"></main>

<div class="lb" id="lb">
  <div class="bar">
    <button id="prev" title="Previous (left arrow)">&#8592; Prev</button>
    <button id="next" title="Next (right arrow)">Next &#8594;</button>
    <div class="cap" id="cap"></div>
    <a id="open" target="_blank" rel="noopener"><button>Full size</button></a>
    <button id="close" title="Close (Esc)">&#10005;</button>
  </div>
  <div class="stage">
    <img id="big" alt="">
    <div id="marks"></div>
    <button class="side l" id="sideL" aria-label="Previous"></button>
    <button class="side r" id="sideR" aria-label="Next"></button>
  </div>
  <div class="strip" id="strip"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const FOLDER = "media-source://media_source/frontpath/.";
const THUMBS = "media-source://media_source/frontpath/thumbs";
const WHY = "sensor.front_walkway_frontpath_ble_processing_path_trigger";
// From 20 Oct the camera follows Path Motion, whose trigger says why.
const WHY2 = "sensor.front_walkway_frontpath_ble_processing_path_motion_trigger";
// The Saga's person check (automation frontpath_seen), one logbook line per
// photo set: "detect072009: person 83% (Saga)".
const SEEN = "input_text.frontpath_seen";
let ws, nextId = 1;
const pending = new Map();
let events = [];      // newest first: {key, date, time, kind, why, photos: [{file, id, part, label, url}]}
let flat = [];        // every photo in display order, for Prev / Next
let cur = -1, filter = "all", who = "all", days = [], day = "", notes = {};
// "person 83% (Saga)" / "cat 61% (Saga)" / "animal (AI: ...)" / "nothing ..."
// Where it was, at the end of the verdict: "[b cat 0.41,0.32,0.08,0.2]"
// (photo, what, left, top, width, height as fractions); "~b" is the AI's.
const BOX = /\s*\[(~?)([abc]) ([a-z ]+?) ([\d.]+),([\d.]+),([\d.]+),([\d.]+)\]/g;
const boxesOf = v => [...v.matchAll(BOX)].map(m => ({ ai: !!m[1], part: m[2], label: m[3],
  x: +m[4], y: +m[5], w: +m[6], h: +m[7] }));
// An ellipse a little bigger than the box, so the thing itself stays visible.
// Only on the photo the box belongs to: the three photos are seconds apart
// and whoever it was has moved (21 Oct: a box from photo c drawn over photo
// a sat on empty steps). The strip marks the photo that has one.
function marks(boxes, part, labels) {
  return (boxes || []).filter(b => b.part === part).map(b => {
    const w = Math.max(b.w * 1.5, .04), h = Math.max(b.h * 1.5, .04);
    const x = b.x + b.w / 2 - w / 2, y = b.y + b.h / 2 - h / 2;
    const cls = ["mark", b.label === "person" ? "person" : b.label === "unsure" ? "unsure" : "animal", b.ai ? "ai" : ""].join(" ");
    const tip = labels ? `<span>${b.label}${b.ai ? " (AI, rough)" : ""}</span>` : "";
    return `<div class="${cls}" style="left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%">${tip}</div>`;
  }).join("");
}
const hasBox = (boxes, part) => (boxes || []).some(b => b.part === part);
const whoOf = v => !v ? "" : /^person/.test(v) ? "person" : /^(nothing|no one)/.test(v) ? "none" : /^unsure/.test(v) ? "unsure" : "animal";
const WHO = { person: "person", animal: "animal", none: "no one", unsure: "unsure" };

function status(msg, cls) { $("status").textContent = msg; $("status").className = cls || ""; }

// The Home Assistant app keeps its login to itself (nothing in localStorage)
// and hands a fresh access token to pages that ask: Android through
// window.externalApp, iOS through a webkit message handler; the answer comes
// back by calling the named window function, as for HA's own frontend.
function appToken() {
  const android = window.externalApp && window.externalApp.getExternalAuth;
  const ios = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.getExternalAuth;
  if (!android && !ios) return Promise.resolve(null);
  return new Promise(res => {
    const cb = "galleryAuth" + Date.now();
    const done = t => { delete window[cb]; res(t); };
    window[cb] = (ok, data) => done(ok && data && data.access_token || null);
    const msg = { callback: cb, force: false };
    try {
      if (android) window.externalApp.getExternalAuth(JSON.stringify(msg));
      else window.webkit.messageHandlers.getExternalAuth.postMessage(msg);
    } catch (e) { done(null); }
    setTimeout(() => window[cb] && done(null), 5000);
  });
}

// The login this page can borrow: the dashboard's around it (the "Path
// photos" dashboard is this page in a frame; the app answers getExternalAuth
// in the top frame only, so this comes first), the HA app's, the HA
// frontend's saved tokens (refreshed if stale), else the token pasted into
// the Saga camera page.
async function token() {
  try {
    const ha = window.parent !== window && window.parent.document.querySelector("home-assistant");
    const t = ha && ha.hass && ha.hass.auth && ha.hass.auth.data && ha.hass.auth.data.access_token;
    if (t) return t;
  } catch (e) { /* not framed by HA, or another origin */ }
  const app = await appToken();
  if (app) return app;
  try {
    const t = JSON.parse(localStorage.getItem("hassTokens") || "null");
    if (t && t.access_token) {
      if (Date.now() < (t.expires || 0) - 30000) return t.access_token;
      const body = new URLSearchParams({ grant_type: "refresh_token", client_id: t.clientId, refresh_token: t.refresh_token });
      const r = await fetch("/auth/token", { method: "POST", body });
      if (r.ok) {
        const j = await r.json();
        t.access_token = j.access_token; t.expires = Date.now() + j.expires_in * 1000;
        localStorage.setItem("hassTokens", JSON.stringify(t));
        return t.access_token;
      }
    }
  } catch (e) {}
  try { return localStorage.getItem("sagaToken"); } catch (e) { return null; }
}

function connect() {
  return new Promise(async (ok, fail) => {
    const tok = await token();
    if (!tok) return fail(new Error("Not logged in: open Home Assistant in this browser first, then come back."));
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/websocket");
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "auth_required") ws.send(JSON.stringify({ type: "auth", access_token: tok }));
      else if (m.type === "auth_ok") ok();
      else if (m.type === "auth_invalid") fail(new Error("Home Assistant refused the login: log in again."));
      else if (m.type === "result" && pending.has(m.id)) {
        const p = pending.get(m.id); pending.delete(m.id);
        m.success ? p.ok(m.result) : p.fail(new Error((m.error && m.error.message) || "error"));
      }
    };
    ws.onerror = () => fail(new Error("Could not reach Home Assistant."));
  });
}

function call(msg) {
  return new Promise((ok, fail) => {
    const id = nextId++;
    pending.set(id, { ok, fail });
    ws.send(JSON.stringify({ id, ...msg }));
  });
}

// web-20261016-213631-detect213622-a-frame-2592x1944.jpg  (a, b, c: the path;
// d: the hall camera 25 s on, from 21 Oct)
// 20261016-105200.jpg (Fully)
function parse(file) {
  let m = file.match(/^web-(\d{8})-(\d{6})-(detect|test|inside)(\d{6})-([abcd])-([a-z]+)-(\d+x\d+)/);
  if (m) return { date: m[1], saved: m[2], kind: m[3], time: m[4], part: m[5], how: m[6], size: m[7] };
  m = file.match(/^web-(\d{8})-(\d{6})-([a-z]+)-(\d+x\d+)/);
  if (m) return { date: m[1], saved: m[2], kind: "test", time: m[2], part: "", how: m[3], size: m[4] };
  m = file.match(/^(\d{8})-(\d{6})\.jpg$/);
  if (m) return { date: m[1], saved: m[2], kind: "fully", time: m[2], part: "", how: "Fully still", size: "352x288" };
  return null;
}

const hms = s => s.slice(0, 2) + ":" + s.slice(2, 4) + ":" + s.slice(4, 6);
const ymd = s => s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
const when = (d, t) => new Date(`${ymd(d)}T${hms(t)}`).getTime() / 1000;
const HOW = { frame: "frame", stack: "night stack", full: "full sensor", hall: "hall camera", "Fully still": "Fully still" };

async function load() {
  status("Listing photos...");
  const res = await call({ type: "media_source/browse_media", media_content_id: FOLDER });
  const files = (res.children || []).filter(c => /\.jpe?g$/i.test(c.title));
  const thumbs = new Map();
  try {
    const t = await call({ type: "media_source/browse_media", media_content_id: THUMBS });
    for (const c of t.children || []) thumbs.set(c.title, c.media_content_id);
  } catch (e) { /* no thumbnails yet: full size it is */ }
  const byKey = new Map();
  for (const c of files) {
    const p = parse(c.title);
    if (!p) continue;
    const key = p.kind === "fully" ? "fully" + p.date + p.time : p.kind + p.date + p.time;
    if (!byKey.has(key)) byKey.set(key, { key, date: p.date, time: p.time, kind: p.kind, why: "", photos: [] });
    byKey.get(key).photos.push({ file: c.title, id: c.media_content_id, part: p.part, how: HOW[p.how] || p.how, size: p.size,
      thumb: thumbs.has(c.title) ? { id: thumbs.get(c.title) } : null });
  }
  events = [...byKey.values()];
  events.forEach(e => e.photos.sort((a, b) => a.part.localeCompare(b.part) || a.file.localeCompare(b.file)));
  events.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  if (!events.length) { status("No photos yet."); return; }

  try { notes = JSON.parse(localStorage.getItem("galleryNotes3") || "{}"); } catch (e) {}
  for (const e of events) if (notes[e.key]) {
    e.why = notes[e.key].why; e.kind = notes[e.key].kind; e.seen = notes[e.key].seen || "";
    e.boxes = notes[e.key].boxes || [];
  }
  days = [...new Set(events.map(e => e.date))];          // newest first
  const want = (location.hash.match(/\d{4}-\d{2}-\d{2}/) || [""])[0].replace(/-/g, "");
  const sel = $("day");
  sel.innerHTML = days.map(d => {
    const n = events.filter(e => e.date === d).length;
    return `<option value="${d}">${new Date(ymd(d) + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })} (${n})</option>`;
  }).join("");
  showDay(days.includes(want) ? want : days[0]);
}

const count = () => {
  const ev = events.filter(e => e.date === day);
  return `${ev.length} events, ${ev.reduce((n, e) => n + e.photos.length, 0)} photos on this day.`;
};

// Show one day: cards straight away, then the notes for any of its events
// not already known (kept in this browser, since a note never changes).
async function showDay(d) {
  day = d;
  $("day").value = d;
  history.replaceState(null, "", "#" + ymd(d));
  const i = days.indexOf(d);
  $("newer").disabled = i <= 0;
  $("older").disabled = i >= days.length - 1;
  render();
  const todo = events.filter(e => e.date === d && !notes[e.key] && (e.kind === "detect" || e.kind === "test"));
  if (!todo.length) { status(count()); return; }
  status(count() + " Looking up why " + todo.length + " fired...");
  const t0 = Math.min(...todo.map(e => when(e.date, e.time))) - 60;
  const t1 = Math.max(...todo.map(e => when(e.date, e.time))) + 60;
  const span = { start_time: new Date(t0 * 1000).toISOString(), end_time: new Date(Math.min(t1 * 1000, Date.now())).toISOString() };
  let trig = [], bursts = [], gotTrig = false, gotBursts = false, seenBy = {};
  try {
    // Why each detection fired: the Path (Motion) Trigger at that moment.
    const h = await call({ type: "history/history_during_period", ...span, entity_ids: [WHY, WHY2],
      minimal_response: true, no_attributes: true, significant_changes_only: false });
    trig = [...(h[WHY] || []), ...(h[WHY2] || [])].map(x => ({ t: x.lu || x.lc, s: x.s }))
      .filter(x => x.s && x.s !== "unknown" && x.s !== "unavailable");
    gotTrig = true;
  } catch (e) {}
  try {
    // Who it was, from the person check (a little after the photos).
    const lb = await call({ type: "logbook/get_events", ...span,
      end_time: new Date(Math.min(t1 * 1000 + 120000, Date.now())).toISOString(), entity_ids: [SEEN] });
    for (const x of lb) {
      const m = (x.message || "").match(/^([a-z]+\d{6}): (.+)$/);
      if (m && x.name === "FrontPath seen") seenBy[m[1]] = { boxes: boxesOf(m[2]),
        text: m[2].replace(BOX, "").replace(/ \(Saga.*\)$/, "").replace(/^nothing.*/, "no one") };
    }
  } catch (e) {}
  try {
    // Test shots that frontpath_burst_photo took (its logbook line is
    // attached to the test-shot button, so only that entity is asked for).
    const lb = await call({ type: "logbook/get_events", ...span, entity_ids: ["input_button.saga_cam_test_shot"] });
    bursts = lb.filter(x => x.name === "FrontPath burst photo").map(x => x.when);
    gotBursts = true;
  } catch (e) {}
  const recent = Date.now() / 1000 - 120;   // the newest may not be logged yet
  for (const e of todo) {
    const t = when(e.date, e.time);
    const seen = seenBy[e.kind + e.time], seenNote = seen && seen.text;
    e.seen = whoOf(seenNote);
    e.boxes = seen ? seen.boxes : [];
    if (e.kind === "detect" && gotTrig) {
      let best = null;
      for (const x of trig) if (Math.abs(x.t - t) <= 6 && (!best || Math.abs(x.t - t) < Math.abs(best.t - t))) best = x;
      if (best) e.why = "gates " + best.s;
      if (seenNote) e.why = (e.why ? e.why + " · " : "") + seenNote;
      if (t < recent) notes[e.key] = { why: e.why, kind: e.kind, seen: e.seen, boxes: e.boxes };
    } else if (e.kind === "test" && gotBursts) {
      if (bursts.some(b => Math.abs(b - t) <= 15)) { e.kind = "burst"; e.why = "every gate lit at once"; }
      if (seenNote) e.why = (e.why ? e.why + " · " : "") + seenNote;
      if (t < recent) notes[e.key] = { why: e.why, kind: e.kind, seen: e.seen, boxes: e.boxes };
    }
  }
  try { localStorage.setItem("galleryNotes3", JSON.stringify(notes)); } catch (e) {}
  if (day === d) { render(); status(count()); }
}

const KIND = { detect: "Detection", test: "Test shot", burst: "Radar burst", fully: "Fully still", inside: "Inside (hall camera)" };

function render() {
  const box = $("days");
  box.innerHTML = "";
  flat = [];
  const shown = events.filter(e => e.date === day &&
    (filter === "all" || e.kind === filter || (filter === "test" && e.kind === "fully")) &&
    (who === "all" || (who === "found" ? e.seen === "person" || e.seen === "animal" : e.seen === who)));
  const sec = document.createElement("section");
  const dd = new Date(ymd(day) + "T12:00:00");
  sec.innerHTML = `<h2>${dd.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}</h2>`;
  const grid = document.createElement("div"); grid.className = "grid";
  sec.appendChild(grid); box.appendChild(sec);
  for (const e of shown) {
    const first = flat.length;
    e.photos.forEach(p => flat.push({ e, p }));
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="pic"><img class="thumb" loading="lazy" alt="">${marks(e.boxes, e.photos[0].part, false)}</div>
      <div class="meta"><span class="time">${hms(e.time)}</span>
      <span class="kind ${e.kind}"> · ${KIND[e.kind]}</span>
      ${e.seen ? `<span class="who ${e.seen}"> · ${WHO[e.seen]}${(e.boxes || []).length && !hasBox(e.boxes, e.photos[0].part) ? " (photo " + e.boxes[0].part + ")" : ""}</span>` : ""}
      <div class="why">${e.why || "&nbsp;"}</div></div>`;
    card.onclick = () => open(first);
    grid.appendChild(card);
    lazyUrl(card.querySelector("img"), e.photos[0].thumb || e.photos[0]);
  }
  if (!shown.length) grid.outerHTML = '<p>No photos for this filter on this day.</p>';
}

// Signed image addresses, fetched only when a thumbnail scrolls into view.
const io = new IntersectionObserver(entries => {
  for (const en of entries) if (en.isIntersecting) { io.unobserve(en.target); en.target._load(); }
}, { rootMargin: "400px" });
function lazyUrl(img, p) { img._load = async () => { img.src = await url(p); }; io.observe(img); }
async function url(p) {
  if (!p.url) {
    const r = await call({ type: "media_source/resolve_media", media_content_id: p.id, expires: 6 * 3600 });
    p.url = r.url;
  }
  return p.url;
}

async function open(i) {
  if (i < 0 || i >= flat.length) return;
  cur = i;
  const { e, p } = flat[i];
  $("lb").classList.add("open");
  $("cap").innerHTML = `${ymd(e.date)} ${hms(e.time)} · ${KIND[e.kind]}${e.why ? " · " + e.why : ""}
    <small>${p.part ? "(" + p.part + ") " : ""}${p.how}, ${p.size} · ${i + 1} of ${flat.length}</small>`;
  $("marks").innerHTML = "";
  const u = await url(p);
  if (cur !== i) return;
  $("marks").innerHTML = marks(e.boxes, p.part, true);
  $("big").src = u;
  placeMarks();
  $("open").href = u;
  const strip = $("strip");
  strip.innerHTML = "";
  for (const q of e.photos) {
    const im = document.createElement("img");
    im.className = (q === p ? "cur" : "") + (hasBox(e.boxes, q.part) ? " hit" : "");
    url(q.thumb || q).then(v => { im.src = v; });
    im.onclick = () => open(flat.findIndex(f => f.p === q));
    strip.appendChild(im);
  }
  // Warm the next photo so Next is instant.
  if (flat[i + 1]) url(flat[i + 1].p).then(v => { new Image().src = v; });
}
// The marks layer covers exactly the photo as shown (object-fit: contain).
function placeMarks() {
  const im = $("big"), mk = $("marks");
  if (!im.naturalWidth) { mk.style.width = "0"; return; }
  const sc = Math.min(im.clientWidth / im.naturalWidth, im.clientHeight / im.naturalHeight);
  const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
  Object.assign(mk.style, { left: im.offsetLeft + (im.clientWidth - w) / 2 + "px",
    top: im.offsetTop + (im.clientHeight - h) / 2 + "px", width: w + "px", height: h + "px" });
}
$("big").addEventListener("load", placeMarks);
window.addEventListener("resize", placeMarks);
function close() { $("lb").classList.remove("open"); cur = -1; }
$("older").onclick = () => showDay(days[days.indexOf(day) + 1]);
$("newer").onclick = () => showDay(days[days.indexOf(day) - 1]);
$("day").onchange = ev => showDay(ev.target.value);
$("prev").onclick = $("sideL").onclick = () => open(cur - 1);
$("next").onclick = $("sideR").onclick = () => open(cur + 1);
$("close").onclick = close;
document.addEventListener("keydown", ev => {
  if (cur < 0) return;
  if (ev.key === "ArrowLeft") open(cur - 1);
  else if (ev.key === "ArrowRight") open(cur + 1);
  else if (ev.key === "Escape") close();
});
let x0 = null;
$("lb").addEventListener("touchstart", ev => { x0 = ev.touches[0].clientX; }, { passive: true });
$("lb").addEventListener("touchend", ev => {
  if (x0 === null) return;
  const dx = ev.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) open(cur + (dx < 0 ? 1 : -1));
});
document.querySelectorAll(".filters button[data-f]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".filters button[data-f]").forEach(x => x.classList.toggle("on", x === b));
  filter = b.dataset.f; render(); status(count());
});
document.querySelectorAll(".filters button[data-w]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".filters button[data-w]").forEach(x => x.classList.toggle("on", x === b));
  who = b.dataset.w; render(); status(count());
});

connect().then(load).catch(e => status(e.message, "err"));
</script>
</body>
</html>
