# Forgot something? (21 Oct 2026)
#
# Things to take along get put in the hall and forgotten. So: put them by the
# door, press "Remember the hall" (input_button.saga_cam_hall_remember, on the
# Front door dashboard); the Saga's hall camera takes a reference photo
# (hallref<hhmmss>-a-frame), which saga_web_log records in
# input_text.frontpath_hall_reference: the check is armed while that is set.
#
# Leaving: Andy's Pixel reaches Bermuda area "Front walkway"
# (input_datetime.pixel_at_front_walkway, kept by frontpath_person_alert)
# and the path camera takes a person set, whose photo d is the hall 25 s
# after the first frame, by when he has gone through. When that photo d
# arrives (input_text.frontpath_last_photos) with the Pixel out front within
# 2 minutes, Claude compares the reference with it: are the things that were
# by the door still there? Yes: "Forgot something?" to the Pixel with the
# photo. A third photo makes that answerable: the hall as it was before
# "Remember" (input_text.frontpath_hall_baseline, the previous hall photo,
# kept by saga_web_log from input_text.frontpath_hall_latest), so the things
# to take are what the reference has and the baseline has not; the first
# test (21 Oct 16:43) with no baseline flagged a basket that always lives
# there. Either way the reference is cleared (one shot); an unused one is
# cleared at 03:00. Only Andy for now: without a door sensor the kids'
# departures cannot be told from arrivals.
#
# Automatic on weekday mornings (21 Oct): frontpath_hall_watch has the Saga
# take a hall photo every 5 min from 07:00 to 08:30 (hallwatch...), and
# saga_web_log keeps the last four hall photos of any kind in
# input_text.frontpath_hall_history. When Andy leaves between 07:15 and
# 08:45 with nothing armed by hand, the baseline is the newest hall photo
# 15+ min old, the reference the newest one since then, and the question
# becomes "what appeared since the baseline and is still there?". At most
# once per 20 min (input_datetime.frontpath_hall_checked). The hall is
# always messy, so this one is an experiment.
#
# Deployed with ha_set_automation, id frontpath_hall_check; the two helpers
# with ha_set_helper.
id: frontpath_hall_check
alias: Front Path - forgot something
description: >-
  While a hall reference photo is armed ("Remember the hall"), or
  automatically on weekday mornings from the hall watch photos, when Andy's
  Pixel is out front and a person set's hall photo (d) arrives, Claude
  compares the hall before and after and the Pixel is told what is still
  there. Manual: one shot, cleared at 03:00 if unused.
mode: single
triggers:
  - trigger: state
    entity_id: input_text.frontpath_last_photos
    id: photo
  - trigger: time
    at: "03:00:00"
    id: expire
variables:
  reference: "{{ states('input_text.frontpath_hall_reference') }}"
  baseline: >-
    {% set b = states('input_text.frontpath_hall_baseline') %}
    {{ b if b not in ['', 'unknown', 'unavailable'] and b != reference else '' }}
  armed: "{{ reference not in ['', 'unknown', 'unavailable'] }}"
  # The automatic morning check: from the rolling hall history.
  history: >-
    {{ states('input_text.frontpath_hall_history').split(' ')
       | reject('in', ['', 'unknown', 'unavailable']) | list }}
  cutoff: "{{ (now() - timedelta(minutes=15)).strftime('%Y%m%d-%H%M%S') }}"
  auto_base: >-
    {% set old = history | select('search', '^web-') | select('lt', 'web-' ~ cutoff) | list %}
    {{ old | sort | last if old else '' }}
  in_window: >-
    {{ now().weekday() < 5 and today_at('07:15') <= now() <= today_at('08:45') }}
  auto_quiet: >-
    {{ as_timestamp(now()) - as_timestamp(states('input_datetime.frontpath_hall_checked'), 0) > 1200 }}
  area_sensor: sensor.bermuda_0a1b8d570db2459d80d2b1e17395fbcb_100_40004_area
  pixel_out: >-
    {{ is_state(area_sensor, 'Front walkway')
       or as_timestamp(now()) - as_timestamp(states('input_datetime.pixel_at_front_walkway'), 0) < 120 }}
  after: >-
    {% set photos = states('input_text.frontpath_last_photos').split(' ') | select('search', '-d-hall-') | list %}
    {{ photos | last if photos else '' }}
  new_hall: >-
    {{ trigger.id == 'photo' and after != ''
       and (trigger.from_state is none or after not in (trigger.from_state.state | default(''))) }}
actions:
  - choose:
      - conditions: "{{ trigger.id == 'expire' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ armed }}"
            then:
              - action: logbook.log
                data:
                  name: Hall check
                  message: "Reference {{ reference }} not used; forgotten."
                  entity_id: input_text.frontpath_hall_reference
              - action: input_text.set_value
                target:
                  entity_id: input_text.frontpath_hall_reference
                data:
                  value: ""
      - conditions: >-
          {{ new_hall and pixel_out and (armed or (in_window and auto_quiet and auto_base != '')) }}
        sequence:
          - variables:
              auto: "{{ not armed }}"
              # Automatic: the newest hall photo since the baseline, not the
              # one taken after leaving.
              auto_ref: >-
                {% set new = history | select('search', '^web-') | select('ge', 'web-' ~ cutoff)
                   | reject('eq', after) | list %}
                {{ new | sort | last if new else '' }}
              base: "{{ auto_base if auto else baseline }}"
              ref: "{{ auto_ref if auto else reference }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.frontpath_hall_checked
            data:
              timestamp: "{{ as_timestamp(now()) }}"
          - action: ai_task.generate_data
            continue_on_error: true
            response_variable: ai
            data:
              task_name: frontpath hall check
              entity_id: ai_task.claude_ai_task
              instructions: >-
                {% if auto %}Photos of the same hallway from a camera by the
                front door, oldest first. The first is the hall 15 minutes or
                more ago; {% if ref %}the second is shortly before someone
                went out; {% endif %}the last is just now, after someone went
                out. The hall is always messy, so ignore what was already in
                the first photo. Things that appeared since the first photo
                and are still there in the last were probably put down to be
                taken along and forgotten.{% elif baseline %}Three photos of the same hallway from a
                camera by the front door. Photo 1: the hall some time
                earlier, as it normally is. Photo 2: after things to take
                along were put down near the door (on the floor, the bench
                or the shelves by the door). Photo 3: just now, after someone
                went out. The things to take are what photo 2 has that photo
                1 does not. Which of those are still there in photo 3?
                {% else %}Two photos of the same hallway from a camera by the
                front door. The first was taken when things to take along
                were put down near the door (on the floor, the bench or the
                shelves by the door). The second was taken just now, after
                someone went out. Which of the things that were put down in
                the first photo are still there in the second?{% endif %}
                Never count footwear or clothes: people swap indoor shoes or
                slippers for outdoor ones on the way out, so shoes, slippers
                and boots left behind (or moved, or gone) are normal, and so
                are coats, jackets, hats and scarves taken down or left. Also
                ignore the permanent clutter. Only count things that look
                placed to be taken: bags, rucksacks, boxes, parcels, a
                basket, a lunch box, sports kit, a helmet, a bottle, keys. Answer still_there yes if
                any such thing is still there, no if they are gone or if
                nothing looked placed to be taken. In 'items' name what is
                still there, briefly.
              structure:
                still_there:
                  required: true
                  selector:
                    select:
                      options: ["yes", "no"]
                items:
                  required: true
                  selector:
                    text: {}
              # Baseline (when there is one), reference, after: a list built
              # in a loop; Home Assistant reads the rendered list back natively.
              attachments: >-
                {% set files = ([base] if base else []) + ([ref] if ref else []) + [after] %}
                {% set ns = namespace(l=[]) %}
                {% for f in files %}
                {% set ns.l = ns.l + [{'media_content_id': 'media-source://media_source/frontpath/' ~ f, 'media_content_type': 'image/jpeg'}] %}
                {% endfor %}
                {{ ns.l }}
          - variables:
              still: "{{ ai is defined and ai.data is defined and ai.data and ai.data.still_there in ['yes', True, 'true'] }}"
              items: "{{ ai.data['items'] if ai is defined and ai.data is defined and ai.data else 'no answer from the AI' }}"
          - if:
              - condition: template
                value_template: "{{ still }}"
            then:
              - action: notify.mobile_app_pixel_8
                continue_on_error: true
                data:
                  title: Forgot something?
                  message: "Still in the hall: {{ items | truncate(120) }}"
                  data:
                    image: "/media/frontpath/{{ after }}"
                    clickAction: /path-photos
                    tag: hall-check
                    channel: Front path
                    priority: high
                    ttl: 0
          - action: logbook.log
            data:
              name: Hall check
              message: >-
                {{ '(auto) ' if auto else '' }}{{ 'Still there: ' ~ items if still else 'Taken (' ~ items ~ ')' }}
                ({{ base or 'no baseline' }}, {{ ref or 'no reference' }} vs {{ after }})
              entity_id: input_text.frontpath_hall_reference
          - if:
              - condition: template
                value_template: "{{ not auto }}"
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.frontpath_hall_reference
                data:
                  value: ""
