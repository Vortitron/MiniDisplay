<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saga Camera Test</title>
<!-- Installable as an app ("Front door"): full screen, no address bar. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101214">
<!--
  Saga camera test (16 Oct 2026). Served by Home Assistant from
  /config/www/saga-cam/index.html at /local/saga-cam/index.html.

  Open it on the Saga in Chrome over HTTPS (the camera needs a secure page),
  with the Push camera's webhook id after '#':
      .../local/saga-cam/index.html#hook=<webhook id>
  The id is never written into this file: /local is served without a login.
  It is remembered on that device only (localStorage).

  What it answers: what resolution and night quality the Saga's camera gives
  a web page, compared with the 352x288 frames Fully Kiosk hands to HA.
  "Send to HA" posts the last photo to camera.saga_web (Push camera).

  Remote tests: add &auto=1 and the page starts the camera, waits for the
  exposure to settle, then takes and sends a full-sensor photo and a night
  stack, with no one at the tablet (Chrome must already have the camera
  permission for the site). &facing=environment or &facing=user picks a
  camera by direction; otherwise the one last chosen here is used.
  Live mode (&live=1, or the button): keeps the camera running, connects to
  Home Assistant with the access token typed into the box on the page (kept
  in this browser only, never in the file or the address), and on every
  "Path Person Detected" takes a frame at once, a night stack a second later
  and another frame after that, named detect<HHMMSS>-a/b/c-... It also takes
  a test shot whenever input_button.saga_cam_test_shot is pressed, and says
  "Live: alive ..." every 10 minutes (automation saga_web_watchdog reopens
  the page if that stops). Use a token from a non-admin user.
  Uploads are named <mode>-<width>x<height>.jpg. Status lines go to webhook
  <id>_log: automation saga_web_log writes them to the logbook, marks
  input_datetime.saga_cam_last_seen, and on "Sent <name>.jpg" saves the
  photo to /config/frontpath_snapshots/web-<time>-<name>.
-->
<style>
  :root {
    --bg: #101214; --panel: #1a1d21; --line: #2c3036; --text: #e8eaed;
    --muted: #9aa0a6; --accent: #8ab4f8; --good: #81c995; --bad: #f28b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, sans-serif; padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px; font: inherit;
  }
  button:active { background: var(--line); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  .panel h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  video, img { width: 100%; height: auto; background: #000; border-radius: 6px; display: block; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--muted); max-height: 260px; overflow: auto; }
  .slider { display: grid; grid-template-columns: 9em 1fr 5em; gap: 8px; align-items: center; margin: 4px 0; }
  .slider input { width: 100%; }
  #status, #haStatus { font-size: 13px; color: var(--muted); }
  input[type=password] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px; font: inherit; min-width: 0; flex: 1 1 16em;
  }
  .ok { color: var(--good); } .err { color: var(--bad); }
  /* Door view (live mode): the front-door dashboard fills the screen, the
     camera keeps running underneath, and the dot in the corner shows its
     state (green = camera on and HA connected). Tap the dot for the tools. */
  #dash { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; z-index: 10; background: var(--bg); display: none; }
  body.door #dash { display: block; }
  #dot { position: fixed; right: 8px; bottom: 8px; z-index: 11; width: 18px; height: 18px; border-radius: 50%;
         background: var(--bad); opacity: .75; display: none; border: 2px solid var(--bg); }
  #dot.good { background: var(--good); }
  body.live #dot { display: block; }
</style>
</head>
<body>
<iframe id="dash" title="Front door"></iframe>
<div id="dot" title="Camera / Home Assistant status: tap for the camera tools"></div>
<h1>Saga camera test</h1>

<div class="row">
  <select id="cams"><option value="">Cameras appear after Start</option></select>
  <button class="primary" id="start">Start camera</button>
  <span id="status">Not started.</span>
</div>

<div class="row">
  <input id="token" type="password" autocomplete="off" placeholder="Home Assistant access token (Saga camera user)">
  <button id="saveToken">Save token</button>
  <button id="forgetToken">Forget token</button>
  <button class="primary" id="live">Start live mode</button>
  <span id="haStatus">HA: not connected</span>
</div>

<div class="row">
  <button id="frame">Photo: video frame</button>
  <button id="photo">Photo: full sensor</button>
  <button id="stack">Photo: night stack (8 frames)</button>
  <button class="primary" id="send" disabled>Send to HA</button>
</div>

<div class="grid">
  <div class="panel">
    <h2>Live</h2>
    <video id="video" playsinline muted autoplay></video>
  </div>
  <div class="panel">
    <h2 id="lastTitle">Last photo</h2>
    <img id="last" alt="">
  </div>
  <div class="panel">
    <h2>Exposure</h2>
    <div id="controls"><pre>Start the camera to see what it lets a web page adjust.</pre></div>
  </div>
  <div class="panel">
    <h2>What the camera reports</h2>
    <pre id="info"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let stream = null, track = null, lastBlob = null, lastName = "saga.jpg";
// Tests ask for the sensor's best; live mode, running for days, asks for 5 MP.
let wantW = 4096, wantH = 3072;

function param(name) {
  const m = location.hash.match(new RegExp("[#&]" + name + "=([A-Za-z0-9_-]+)"));
  return m ? m[1] : null;
}
function remembered(key, value) {
  try {
    if (value !== undefined) localStorage.setItem(key, value);
    return localStorage.getItem(key);
  } catch (e) { return null; }
}

function status(msg, cls) {
  const s = $("status");
  s.textContent = msg;
  s.className = cls || "";
  report(msg);
}

// Every status line also goes to Home Assistant's logbook ("Saga camera
// page"), so a remote run that fails can be seen from there.
function report(msg) {
  const id = hook();
  if (!id) return;
  try {
    fetch("/api/webhook/" + encodeURIComponent(id + "_log"), {
      method: "POST", keepalive: true,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ msg: String(msg).slice(0, 250) }),
    }).catch(() => {});
  } catch (e) {}
}
window.addEventListener("error", e => report("Page error: " + e.message));
window.addEventListener("unhandledrejection", e => report("Page error: " + (e.reason && e.reason.message || e.reason)));

// The webhook id: from '#hook=...' if given, else what this device remembered.
function hook() {
  const m = location.hash.match(/hook=([A-Za-z0-9_-]+)/);
  try {
    if (m) localStorage.setItem("sagaHook", m[1]);
    return m ? m[1] : localStorage.getItem("sagaHook");
  } catch (e) {
    return m ? m[1] : null;
  }
}

async function keepAwake() {
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

async function listCameras(selected) {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("cams");
  sel.innerHTML = "";
  devices.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || `Camera ${i + 1}`;
    if (d.deviceId === selected) o.selected = true;
    sel.appendChild(o);
  });
}

async function start() {
  if (!window.isSecureContext) {
    status("Not a secure page: open it over https, or Chrome will not allow the camera.", "err");
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  const picked = $("cams").value && $("cams").value.length > 20 ? $("cams").value : remembered("sagaCam");
  const facing = param("facing");
  const deviceId = facing ? undefined : (picked || undefined);
  status("Asking for the camera...");
  const ask = id => navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      deviceId: id ? { exact: id } : undefined,
      facingMode: facing ? { exact: facing } : undefined,
      width: { ideal: wantW }, height: { ideal: wantH },
      // 17 Oct: uncapped (30 fps by day) the Saga lost ~9%/h on its charger
      // and went flat; at night the camera slows itself for long exposures
      // and it held. 10 fps is plenty for a still and for the night stack.
      frameRate: { ideal: 10, max: 10 },
    },
  });
  // Another tab holding the camera can leave this waiting for ever.
  const within = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(
    () => no(new Error("no camera after " + ms / 1000 + " s: another tab or app may hold it")), ms))]);
  try {
    try {
      stream = await within(ask(deviceId), 15000);
    } catch (e) {
      if (!deviceId || e.name !== "OverconstrainedError") throw e;
      stream = await ask(undefined);   // the remembered camera has gone
    }
  } catch (e) {
    status("Camera refused: " + e.name + " " + e.message, "err");
    return;
  }
  track = stream.getVideoTracks()[0];
  $("video").srcObject = stream;
  // Photos need a playing video: wait (up to 5 s) until it has a picture.
  try { await $("video").play(); } catch (e) {}
  for (let i = 0; i < 50 && !$("video").videoWidth; i++) await new Promise(r => setTimeout(r, 100));
  if (track.getSettings().deviceId) remembered("sagaCam", track.getSettings().deviceId);
  await listCameras(track.getSettings().deviceId);
  await keepAwake();
  await describe();
  const s = track.getSettings();
  status(`Streaming ${s.width}x${s.height}.`, "ok");
}

async function describe() {
  const info = { settings: track.getSettings() };
  try { info.capabilities = track.getCapabilities(); } catch (e) {}
  if ("ImageCapture" in window) {
    try { info.photoCapabilities = await new ImageCapture(track).getPhotoCapabilities(); }
    catch (e) { info.photoCapabilities = "unavailable: " + e.message; }
  } else {
    info.photoCapabilities = "ImageCapture not supported in this browser";
  }
  $("info").textContent = JSON.stringify(info, null, 1);
  buildControls(info.capabilities || {}, info.settings);
}

// Sliders for whatever exposure settings the camera exposes to the page.
function buildControls(caps, settings) {
  const box = $("controls");
  box.innerHTML = "";
  const names = ["exposureCompensation", "exposureTime", "iso", "brightness", "contrast", "sharpness", "zoom"];
  if (caps.exposureMode) {
    const row = document.createElement("div");
    row.className = "row";
    caps.exposureMode.forEach(mode => {
      const b = document.createElement("button");
      b.textContent = "Exposure: " + mode;
      b.onclick = () => apply({ exposureMode: mode });
      row.appendChild(b);
    });
    box.appendChild(row);
  }
  let any = false;
  names.forEach(name => {
    const c = caps[name];
    if (!c || typeof c.min !== "number") return;
    any = true;
    const row = document.createElement("div");
    row.className = "slider";
    const label = document.createElement("span");
    label.textContent = name;
    const input = document.createElement("input");
    input.type = "range";
    input.min = c.min; input.max = c.max; input.step = c.step || (c.max - c.min) / 100;
    input.value = settings[name] !== undefined ? settings[name] : c.min;
    const val = document.createElement("span");
    val.textContent = input.value;
    input.onchange = () => {
      val.textContent = input.value;
      const extra = name === "exposureTime" || name === "iso" ? { exposureMode: "manual" } : {};
      apply({ ...extra, [name]: Number(input.value) });
    };
    row.append(label, input, val);
    box.appendChild(row);
  });
  if (!any && !caps.exposureMode) {
    box.innerHTML = "<pre>This camera lets the page adjust nothing: the browser picks exposure itself.</pre>";
  }
}

async function apply(constraint) {
  try {
    await track.applyConstraints({ advanced: [constraint] });
    status("Applied " + JSON.stringify(constraint), "ok");
    await describe();
  } catch (e) {
    status("Could not apply " + JSON.stringify(constraint) + ": " + e.message, "err");
  }
}

function show(blob, how) {
  lastBlob = blob;
  lastName = how.split(" ")[0];
  const url = URL.createObjectURL(blob);
  const img = $("last");
  img.onload = () => {
    lastName = `${lastName}-${img.naturalWidth}x${img.naturalHeight}.jpg`;
    $("lastTitle").textContent = `Last photo: ${how}, ${img.naturalWidth}x${img.naturalHeight}, ${Math.round(blob.size / 1024)} KB`;
  };
  img.src = url;
  $("send").disabled = false;
  status("Photo taken (" + how + ").", "ok");
}

function canvasBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, "image/jpeg", 0.92));
}

// A frame straight from the camera track. The <video> element can stop
// updating while the camera runs on (16 Oct 20:03: two "frames" 6 s apart
// were byte-identical), so it is only the fallback.
async function grab() {
  if (!("ImageCapture" in window) || !track || track.readyState !== "live") return null;
  try { return await new ImageCapture(track).grabFrame(); } catch (e) { return null; }
}

async function photoFrame() {
  if (!track) return status("Start the camera first.", "err");
  const v = $("video");
  const bmp = await grab();
  const c = document.createElement("canvas");
  c.width = bmp ? bmp.width : v.videoWidth; c.height = bmp ? bmp.height : v.videoHeight;
  c.getContext("2d").drawImage(bmp || v, 0, 0);
  if (bmp) bmp.close();
  show(await canvasBlob(c), "frame video");
}

async function photoFull() {
  if (!track) return status("Start the camera first.", "err");
  if (!("ImageCapture" in window)) return status("This browser has no ImageCapture: use the video frame.", "err");
  status("Taking a full-sensor photo...");
  try {
    const ic = new ImageCapture(track);
    const pc = await ic.getPhotoCapabilities();
    const opts = pc.imageWidth ? { imageWidth: pc.imageWidth.max, imageHeight: pc.imageHeight.max } : {};
    show(await ic.takePhoto(opts), "full sensor");
  } catch (e) {
    status("Full-sensor photo failed: " + e.message, "err");
  }
}

// Average 8 frames ~120 ms apart. Sensor noise is random from frame to
// frame and averages away; a still scene does not. Roughly a 2.8x cut in
// noise, for a night shot of a path where nothing moves fast.
async function photoStack() {
  if (!track) return status("Start the camera first.", "err");
  const v = $("video");
  const st = track.getSettings();
  const fw = st.width || v.videoWidth, fh = st.height || v.videoHeight;
  // At most 1920 wide: eight full-sensor frames would not fit a tablet's memory.
  const k = Math.min(1, 1920 / fw);
  const w = Math.round(fw * k), h = Math.round(fh * k), N = 8;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  const sum = new Float32Array(w * h * 3);
  for (let n = 0; n < N; n++) {
    status(`Stacking frame ${n + 1} of ${N}...`);
    const bmp = await grab();
    ctx.drawImage(bmp || v, 0, 0, w, h);
    if (bmp) bmp.close();
    const d = ctx.getImageData(0, 0, w, h).data;
    for (let i = 0, j = 0; i < d.length; i += 4, j += 3) {
      sum[j] += d[i]; sum[j + 1] += d[i + 1]; sum[j + 2] += d[i + 2];
    }
    await new Promise(r => setTimeout(r, 120));
  }
  const out = ctx.createImageData(w, h);
  for (let i = 0, j = 0; i < out.data.length; i += 4, j += 3) {
    out.data[i] = sum[j] / N; out.data[i + 1] = sum[j + 1] / N; out.data[i + 2] = sum[j + 2] / N; out.data[i + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
  show(await canvasBlob(c), "stack of 8 frames");
}

// The Vome hosted address refused uploads of about 1 MB or more (413, 16 Oct),
// and this page has to be on it for Chrome to allow the camera. Each photo
// goes up full size first; after a 413 the page squeezes everything under
// 950 KB (lower JPEG quality first, then the size) until it is reloaded.
// So when the limit is raised, full-size photos start arriving by themselves.
const LIMIT = 950 * 1024;
let squeeze = false;
async function fit(blob) {
  if (blob.size <= LIMIT) return { blob, w: 0, h: 0 };
  const bmp = await createImageBitmap(blob);
  let w = bmp.width, h = bmp.height;
  for (let pass = 0; pass < 12; pass++) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    for (const q of [0.9, 0.8, 0.7]) {
      const out = await new Promise(res => c.toBlob(res, "image/jpeg", q));
      if (out.size <= LIMIT) { bmp.close(); c.width = c.height = 0; return { blob: out, w, h, q }; }
    }
    c.width = c.height = 0;
    w = Math.round(w * 0.85); h = Math.round(h * 0.85);
  }
  bmp.close();
  return { blob, w: 0, h: 0 };
}

async function send() {
  const id = hook();
  if (!id) return status("No webhook id: open the page with #hook=<id> after the address.", "err");
  if (!lastBlob) return status("Take a photo first.", "err");
  status("Sending to Home Assistant...");
  let body = lastBlob, name = lastName;
  if (!squeeze && lastBlob.size > LIMIT) {
    const first = new FormData();
    first.append("image", lastBlob, lastName);
    try {
      const r0 = await fetch("/api/webhook/" + encodeURIComponent(id), { method: "POST", body: first });
      if (r0.ok) { status("Sent " + name + ": camera.saga_web has it.", "ok"); return true; }
      if (r0.status === 413) { squeeze = true; status("Upload limit hit (413): squeezing photos from now on."); }
      else { status("Home Assistant said " + r0.status, "err"); return false; }
    } catch (e) { status("Send failed: " + e.message, "err"); return false; }
  }
  if (lastBlob.size > LIMIT) {
    const f = await fit(lastBlob);
    body = f.blob;
    if (f.w) {
      name = lastName.replace(/-\d+x\d+\.jpg$/, "") + `-${f.w}x${f.h}-q${Math.round(f.q * 100)}.jpg`;
      status(`Squeezed ${Math.round(lastBlob.size / 1024)} KB to ${Math.round(body.size / 1024)} KB (${f.w}x${f.h}, quality ${f.q}) for the 1 MB upload limit.`);
    }
  }
  const form = new FormData();
  form.append("image", body, name);
  try {
    const r = await fetch("/api/webhook/" + encodeURIComponent(id), { method: "POST", body: form });
    status(r.ok ? "Sent " + name + ": camera.saga_web has it." : "Home Assistant said " + r.status, r.ok ? "ok" : "err");
    return r.ok;
  } catch (e) {
    status("Send failed: " + e.message, "err");
    return false;
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
// Wait until the image has loaded, so lastName carries the size.
const loaded = () => new Promise(r => { const i = $("last"); i.complete ? r() : (i.onload = (f => () => { f && f(); r(); })(i.onload)); });

// One run at a time: a page opened by a link with '#...' can also get a
// hashchange, and a second start() stops the first run's camera (16 Oct:
// "source width is 0", "Requested device not found").
let autoRunning = false;
async function auto() {
  if (autoRunning) return;
  autoRunning = true;
  try { await autoRun(); } finally { autoRunning = false; }
}

async function autoRun() {
  await start();
  if (!track) return;
  status("Auto: letting the exposure settle...");
  await sleep(4000);
  // The stack first: after a 12 MP full-sensor photo the tab can run out of
  // memory part-way through it (16 Oct: it stopped at frame 1, twice).
  await photoStack();
  await sleep(500); await loaded(); await send();
  await sleep(3000);
  lastBlob = null;
  if ("ImageCapture" in window) await photoFull();
  if (!lastBlob) await photoFrame();
  await sleep(500); await loaded(); await send();
  lastBlob = null;
  status("Auto test done: two photos sent.", "ok");
}

// ---- Live mode -----------------------------------------------------------
const DETECT = "binary_sensor.frontpath_ble_processing_path_person_detected";
// Path Motion (20 Oct): FrontPath's twitchy sensor, for this camera only. It
// fires for cats and the tree too; each photo set is checked for a person
// below (classify) and the verdict goes to HA (automation frontpath_seen).
const MOTION = "binary_sensor.front_walkway_frontpath_ble_processing_path_motion";
const WHY = "sensor.front_walkway_frontpath_ble_processing_path_motion_trigger";
const TEST = "input_button.saga_cam_test_shot";
const RELOAD = "input_button.saga_cam_reload";
const INSIDE = "input_button.saga_cam_inside_shot";
// "Remember the hall" (21 Oct): a hall photo as the reference for the
// forgot-something check (automation frontpath_hall_check), named hallref.
const HALLREF = "input_button.saga_cam_hall_remember";
// Hall watch: a quiet hall photo every 5 min on weekday mornings (automation
// frontpath_hall_watch), named hallwatch, for the automatic hall check.
const HALLWATCH = "input_button.saga_cam_hall_watch";
let ws = null, wsId = 1, liveOn = false, why = "", lastShot = 0, shooting = false;
// Live mode lets go of the camera at 15% battery and takes it back at 35%,
// so a charger that cannot keep up does not run the Saga flat (17 Oct).
let lowBattery = false;

function haStatus(msg, cls) {
  $("haStatus").textContent = "HA: " + msg;
  $("haStatus").className = cls || "";
}

function connect() {
  const tok = remembered("sagaToken");
  if (!tok) { haStatus("no token saved", "err"); return; }
  if (ws && ws.readyState <= 1) return;
  haStatus("connecting...");
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/websocket");
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "auth_required") ws.send(JSON.stringify({ type: "auth", access_token: tok }));
    else if (m.type === "auth_invalid") { haStatus("token refused", "err"); report("Live: Home Assistant refused the token"); ws.close(); }
    else if (m.type === "auth_ok") {
      haStatus("connected, watching", "ok");
      ws.send(JSON.stringify({ id: wsId++, type: "subscribe_entities", entity_ids: [DETECT, MOTION, WHY, TEST, RELOAD, INSIDE, HALLREF, HALLWATCH] }));
      report("Live: connected to Home Assistant, watching for detections");
    } else if (m.type === "event" && m.event) onEntities(m.event);
  };
  ws.onclose = () => {
    haStatus("disconnected, retrying", "err");
    if (liveOn) setTimeout(connect, 10000);
  };
}

// subscribe_entities: "a" is the first full state, "c" the changes since.
function onEntities(e) {
  for (const [id, st] of Object.entries(e.a || {})) if (id === WHY) why = st.s;
  for (const [id, ch] of Object.entries(e.c || {})) {
    const s = ch["+"] && ch["+"].s;
    if (s === undefined) continue;
    if (id === WHY) why = s;
    else if ((id === DETECT || id === MOTION) && s === "on") burst("detect", id === DETECT);
    else if (id === TEST) burst("test", true);
    else if (id === INSIDE) insideShot("inside" + hhmmss() + "-a", "frame hall");
    else if (id === HALLREF) insideShot("hallref" + hhmmss() + "-a", "frame hall");
    else if (id === HALLWATCH) insideShot("hallwatch" + hhmmss() + "-a", "frame hall");
    // Pressed after the page is updated: reload in this tab, so no second
    // tab ends up fighting this one for the camera.
    else if (id === RELOAD) {
      report("Live: reloading the page");
      release();
      location.replace(location.pathname + "?v=" + Date.now() + location.hash);
    }
  }
}

function hhmmss() { return new Date().toTimeString().slice(0, 8).replace(/:/g, ""); }

async function shoot(prefix, kind) {
  if (document.hidden || lowBattery) return;   // a background tab: the visible one shoots
  if (!track || track.readyState !== "live") { await start(); if (!track) return; }
  lastBlob = null;
  if (kind === "stack") await photoStack(); else await photoFrame();
  if (!lastBlob) return;
  await sleep(300); await loaded();
  lastName = prefix + "-" + lastName;
  await send();
}

// A frame at once (someone may be gone in seconds), a night stack, then a
// frame a few seconds on, when someone walking up is nearer the door. Then,
// when it looks like a person (the person rule fired, the detector here
// scored 50%+, or it was a test shot), the hall camera 25 s after the first
// frame: photo d of the same set, by when a visitor has come in or someone
// leaving has gone through (21 Oct).
async function burst(kind, personRule) {
  if (document.hidden || shooting || Date.now() - lastShot < 15000) return;
  shooting = true; lastShot = Date.now();
  const t0 = Date.now();
  const tag = kind + hhmmss();
  const blobs = [];
  try {
    await shoot(tag + "-a", "frame");
    if (lastBlob) blobs.push({ part: "a", blob: lastBlob });
    report(`Live: ${kind} ${tag}, gates: ${why || "?"}`);
    await sleep(500);
    await shoot(tag + "-b", "stack");
    if (lastBlob) blobs.push({ part: "b", blob: lastBlob });
    await sleep(2000);
    await shoot(tag + "-c", "frame");
    if (lastBlob) blobs.push({ part: "c", blob: lastBlob });
  } finally { shooting = false; }
  if (blobs.length) seen(tag, kind, blobs).then(r => {
    if (personRule || (r && r.person >= 0.5)) hallLater(tag, t0);
  });
}

async function hallLater(tag, t0) {
  await sleep(Math.max(0, 25000 - (Date.now() - t0)));
  for (let i = 0; i < 4 && shooting; i++) await sleep(5000);   // a new set in the way
  await insideShot(tag + "-d", "hall camera");
}

// The inward (hall) camera: on input_button.saga_cam_inside_shot as a photo
// of its own (inside<hhmmss>-a-frame), or as photo d of a set (hallLater).
// It opens the user-facing camera while the outward one is running, takes a
// frame, sends it, and reports whether the outward stream survived (tested
// 21 Oct on the Saga: 1280x960 in 1.2 s, outward camera unaffected). If the
// outward camera was lost it is started again.
const INSIDE_CAM = { audio: false, video: { facingMode: { exact: "user" },
  width: { ideal: 1280 }, height: { ideal: 960 }, frameRate: { ideal: 10, max: 10 } } };
async function insideShot(prefix, how) {
  if (document.hidden || shooting) return;
  shooting = true;
  const tag = prefix;
  const t0 = Date.now();
  const before = track && track.readyState === "live";
  let s2 = null;
  try {
    s2 = await navigator.mediaDevices.getUserMedia(INSIDE_CAM);
    const v2 = document.createElement("video");
    v2.muted = true; v2.playsInline = true; v2.srcObject = s2;
    try { await v2.play(); } catch (e) {}
    for (let i = 0; i < 30 && !v2.videoWidth; i++) await sleep(100);
    await sleep(700);   // let the exposure settle
    const c = document.createElement("canvas");
    c.width = v2.videoWidth; c.height = v2.videoHeight;
    c.getContext("2d").drawImage(v2, 0, 0);
    const blob = await canvasBlob(c);
    const size = `${c.width}x${c.height}`;
    c.width = c.height = 0;
    const alive = track && track.readyState === "live";
    report(`Live: ${tag}: inward ${size} in ${Date.now() - t0} ms; outward camera ${alive ? "still live" : "STOPPED"} (${before ? "was live" : "was not live"})`);
    show(blob, how);
    await sleep(300); await loaded();
    lastName = prefix + "-" + lastName;
    await send();
  } catch (e) {
    report(`Live: ${tag} failed: ${e.name} ${e.message}; outward camera ${track ? track.readyState : "none"}`);
  } finally {
    if (s2) s2.getTracks().forEach(t => t.stop());
    shooting = false;
  }
  if (liveOn && (!track || track.readyState !== "live")) { report("Live: restarting the outward camera"); await start(); }
}

// Who is it: an object detector (MediaPipe EfficientDet-Lite0, COCO
// classes) run here on the photos, about 15 MB downloaded once and then
// cached. The best person and animal scores over the set go to webhook
// <hook>_seen; HA decides, and asks an AI model about unsure night photos.
// With each best score goes where it was: the photo (a/b/c) and its box as
// fractions of the frame [left, top, width, height] (all three photos have
// the same view), so the gallery can draw it.
const ANIMALS = ["cat", "dog", "bird", "horse", "sheep", "cow", "bear"];
let detector = null, detectorLoading = null;
function getDetector() {
  if (detector) return Promise.resolve(detector);
  if (!detectorLoading) detectorLoading = (async () => {
    const base = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    const vision = await import(base + "/vision_bundle.mjs");
    const files = await vision.FilesetResolver.forVisionTasks(base + "/wasm");
    detector = await vision.ObjectDetector.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite",
        delegate: "CPU",
      },
      runningMode: "IMAGE", scoreThreshold: 0.1, maxResults: 10,
    });
    return detector;
  })().catch(e => { detectorLoading = null; report("Live: detector did not load: " + e.message); throw e; });
  return detectorLoading;
}
async function seen(tag, kind, blobs) {
  let person = 0, animal = "", animalScore = 0, personBox = null, animalBox = null;
  try {
    const d = await getDetector();
    for (const { part, blob } of blobs) {
      const bmp = await createImageBitmap(blob, { resizeWidth: 960, resizeHeight: 720 });
      const res = d.detect(bmp);
      bmp.close();
      for (const det of res.detections || []) {
        const bb = det.boundingBox || {};
        const box = { part, box: [bb.originX / 960, bb.originY / 720, bb.width / 960, bb.height / 720]
          .map(v => Math.round(Math.min(Math.max(v || 0, 0), 1) * 1000) / 1000) };
        for (const c of det.categories || []) {
          if (c.categoryName === "person" && c.score > person) { person = c.score; personBox = box; }
          else if (ANIMALS.includes(c.categoryName) && c.score > animalScore) {
            animalScore = c.score; animal = c.categoryName; animalBox = box;
          }
        }
      }
    }
  } catch (e) { return undefined; }   // no detector: no verdict, as before
  const id = hook();
  if (!id) return;
  try {
    await fetch("/api/webhook/" + encodeURIComponent(id + "_seen"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tag, kind, person: +person.toFixed(3), animal, animal_score: +animalScore.toFixed(3),
        person_box: personBox, animal_box: animalBox }),
    });
  } catch (e) {}
  return { person, animal, animalScore };
}

// Installed as the "Front door" app (19 Oct) the page runs full screen; the
// app shares this browser's storage, so a Chrome tab opened later (an old
// watchdog link) knows the app exists and stays idle rather than fight it
// for the camera.
const shownAs = ["fullscreen", "standalone", "minimal-ui", "browser"]
  .find(m => matchMedia("(display-mode: " + m + ")").matches) || "unknown";
const asApp = shownAs !== "browser";

async function live() {
  if (liveOn) return;
  if (asApp) remembered("sagaApp", String(Date.now()));
  else if (remembered("sagaApp")) {
    status("Live: this is a Chrome tab, but the Front door app is installed, so the tab stays idle. Close it.", "err");
    return;
  }
  liveOn = true;
  report("Live: starting (" + (asApp ? "app" : "tab") + ", " + shownAs + ")");
  wantW = 2592; wantH = 1944;
  $("live").textContent = "Live mode on";
  $("live").disabled = true;
  document.body.classList.add("live", "door");
  $("dash").src = "/" + (param("dash") || "front-door/door").replace(/_/g, "-");
  await start();
  connect();
  getDetector().catch(() => {});   // load it now, not at the first visitor
  setInterval(() => {
    const ok = !lowBattery && track && track.readyState === "live" && ws && ws.readyState === 1;
    $("dot").className = ok ? "good" : "";
  }, 5000);
  setInterval(() => report("Live: alive (" + (asApp ? "app" : "tab") + "), camera " +
    (track && track.readyState === "live" ? "on" : "off") +
    ", HA " + (ws && ws.readyState === 1 ? "connected" : "not connected")), 10 * 60 * 1000);
  // Restart the camera if it is gone, or if its picture has stopped
  // changing: sensor noise makes every real frame differ a little.
  let lastSig = "", same = 0;
  setInterval(async () => {
    if (shooting || document.hidden || lowBattery) return;
    if (!track || track.readyState !== "live") { report("Live: camera lost, restarting it"); await start(); return; }
    const bmp = await grab();
    if (!bmp) return;
    // A 64x48 patch at full resolution: shrinking the whole frame would
    // average the noise away and make a still night look frozen.
    const c = document.createElement("canvas");
    c.width = 64; c.height = 48;
    const ctx = c.getContext("2d");
    ctx.drawImage(bmp, (bmp.width - 64) >> 1, (bmp.height - 48) >> 1, 64, 48, 0, 0, 64, 48);
    bmp.close();
    const sig = Array.from(ctx.getImageData(0, 0, 64, 48).data).join(",");
    same = sig === lastSig ? same + 1 : 0;
    lastSig = sig;
    if (same >= 2) { same = 0; report("Live: picture frozen, restarting the camera"); await start(); }
  }, 60000);
  watchBattery();
}

async function watchBattery() {
  if (!navigator.getBattery) return;
  let b;
  try { b = await navigator.getBattery(); } catch (e) { return; }
  const check = async () => {
    const pct = Math.round(b.level * 100);
    if (!lowBattery && b.level <= 0.15) {
      lowBattery = true;
      release();
      $("dot").className = "";
      report(`Live: battery ${pct}%, camera off until 35%`);
    } else if (lowBattery && b.level >= 0.35) {
      lowBattery = false;
      report(`Live: battery ${pct}%, camera back on`);
      if (!document.hidden) await start();
    }
  };
  b.addEventListener("levelchange", check);
  check();
}

$("saveToken").onclick = () => {
  const v = $("token").value.trim();
  if (!v) return haStatus("paste the token first", "err");
  remembered("sagaToken", v);
  $("token").value = "";
  haStatus("token saved on this device");
  if (liveOn) connect();
};
$("forgetToken").onclick = () => {
  try { localStorage.removeItem("sagaToken"); } catch (e) {}
  if (ws) ws.close();
  haStatus("token forgotten");
};
$("live").onclick = live;
$("dot").onclick = () => document.body.classList.toggle("door");
$("start").onclick = start;
$("cams").onchange = start;
$("frame").onclick = photoFrame;
$("photo").onclick = photoFull;
$("stack").onclick = photoStack;
$("send").onclick = send;
if (!hook()) status("Tip: open with #hook=<webhook id> so photos can be sent to HA.");
else if (param("live") === "1") live();
else if (param("auto") === "1") auto();
// Chrome does not reload a page it already has open when only the part
// after '#' changes, so a second remote run arrives as a hash change.
window.addEventListener("hashchange", () => { if (param("auto") === "1") auto(); });
// Let go of the camera when this tab is hidden or closed, so the next run
// (often a new tab) can have it.
function release() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null;
}
window.addEventListener("pagehide", release);
// Lets Chrome install the page as the full-screen "Front door" app.
if ("serviceWorker" in navigator && window.isSecureContext)
  navigator.serviceWorker.register("sw.js").catch(() => {});
// Live mode too: a hidden tab cannot take photos, and holding the camera
// would lock out the tab that can. It takes the camera back when shown.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && !autoRunning) release();
  else if (!document.hidden && liveOn && !track && !lowBattery) start();
});
</script>
</body>
