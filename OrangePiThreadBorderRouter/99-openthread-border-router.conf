# OpenThread Border Router needs the kernel to forward IPv6 between
# the LAN (end0) and the Thread tunnel (wpan0). Without this, devices
# can join the 802.15.4 mesh while Android/HA get stuck on
# "checking connectivity to Thread network".
#
# Install on the Orange Pi: /etc/sysctl.d/99-openthread-border-router.conf
# Docker host-network containers cannot set these sysctls themselves.
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# Keep accepting Router Advertisements on the LAN uplink even though
# we are now a router (kernel treats accept_ra as 0 when forwarding=1
# unless it is set to 2). Also accept Route Information Options.
net.ipv6.conf.end0.accept_ra = 2
net.ipv6.conf.end0.accept_ra_rt_info_max_plen = 64
