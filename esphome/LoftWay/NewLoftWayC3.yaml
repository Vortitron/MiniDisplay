substitutions:
  lcd_i2c_address: "0x27"
  # GPIO that the AM312 PIR OUT pin is connected to. If detection
  # never fires on the default pin, try moving the OUT wire to a
  # different GPIO and updating this value.
  pir_pin: "GPIO3"
  # Internal pull configuration for the PIR input. Most AM312 modules
  # actively drive the OUT pin so no pull is needed (defaults below).
  # If the line drifts when idle set pir_pulldown to "true". If the
  # module is open-collector active-low, set pir_pullup to "true" and
  # also flip pir_inverted. Never set both to "true".
  pir_pullup: "false"
  pir_pulldown: "false"
  # Set to "true" if your AM312 PIR is active-low (text "true"/"false").
  pir_inverted: "false"
  # NPN/N-MOSFET base/gate for LCD backlight PWM. GPIO4 is LEDC-capable,
  # not a strapping pin, and sits next to the existing GPIO0-3 wiring.
  backlight_pwm_pin: "GPIO4"
  # Momentary push button to GND (internal pull-up). GPIO5's pad is
  # physically damaged, so this is GPIO10 (other column, not BOOT/LED).
  lights_button_pin: "GPIO10"
  # HA area for "all loft lights" and hold-to-off.
  loft_lights_area_id: "loft"
  loft_led_main_entity: "light.loft_lights"
  loft_led_left_entity: "light.isp_1a3c38_3c38"
  loft_led_stairs_entity: "light.isp_0db21e_b21e"
  loft_path_entity: "light.gu10_b505z2_2"
  button_hold_ms: "600"
  # Extra hold after the first off, before night-only stairs-off.
  button_hold_stairs_extra_ms: "1000"
  button_backlight_seconds: "60"
  led_stagger_ms: "500"
  led_retry_wait_ms: "1500"
  lcd_status_success_seconds: "2"
  lcd_status_pending_seconds: "3"
  path_light_seconds: "30"
  weather_temperature_entity: "sensor.sam_outside_temperature"
  weather_condition_entity: "sensor.openweathermap_condition"
  forecast_today_max_entity: "sensor.forecast_today_max"
  forecast_tonight_min_entity: "sensor.forecast_tonight_min"
  notification_ids_entity: "input_text.minidisplay_notification_ids"
  notification_titles_entity: "input_text.minidisplay_notification_titles"
  notification_messages_entity: "input_text.minidisplay_notification_messages"
  calendar_1_entity: "calendar.webcal_im2_api_infomentor_se_v1_calendarv2_icalsubscription_subscription_f0d28bc2_1243_4b0e_962c_02243eeea583"
  calendar_2_entity: "calendar.http_im2_api_infomentor_se_v1_calendarv2_icalsubscription_subscription_8cd9caaa_3f4e_4ee4_b8e8_662e4aa39f09"
  calendar_3_entity: "calendar.handl_f"
  handl_f_slots_entity: "sensor.handl_f_loft_calendar_slots"
  # HA `sun.sun` entity is used for sunset detection. Night mode is
  # entered when the sun is below horizon OR clock hits 23:00, whichever
  # comes first; day mode resumes at 07:00 each morning.
  sun_entity: "sun.sun"
  # Full brightness when someone lingers (HA sliders, 0-100). Night
  # slider 0 falls back to the day slider. From 23:00 to 07:00 the PWM
  # is capped at dim_brightness_night and the sliders are ignored.
  day_brightness_entity: "input_number.loftc3_lcd_brightness_day"
  night_brightness_entity: "input_number.loftc3_lcd_brightness_night"
  # Any PIR edge lights the LCD at this PWM percent (linear, no gamma).
  dim_brightness_day: "16"
  dim_brightness_night: "2"
  # How long the dim glow lasts after the last motion pulse.
  dim_hold_seconds: "8"
  # Motion must be ON continuously for this many seconds before the
  # backlight goes from dim to full.
  pir_continuous_on_seconds: "5"
  # How long full brightness lasts after the last continuous-motion window.
  backlight_hold_seconds: "20"
  # Bedtime: while the Pixel is on charge between these hours, motion no
  # longer lights the LCD (dim glow or full). Button taps still do.
  pixel_charging_entity: "binary_sensor.pixel_8_is_charging"
  pir_quiet_from_hour: "21"
  pir_quiet_until_hour: "7"
  # Fade-through-black between dashboard pages. Out is slower than in.
  # Set fade_thru_black_out_ms to 0 to disable the effect.
  fade_thru_black_out_ms: "450"
  fade_thru_black_in_ms: "120"
  fade_black_hold_ms: "50"
  # Seconds each calendar event stays on screen before advancing.
  cal_event_dwell_seconds: "4"
  # Seconds on non-calendar pages before rotating.
  page_dwell_seconds: "8"
  waste_c1_entity: "sensor.waste_collection_schedule_beda_container_1_packaging_of_paper_plastic_metal_and_clear_glass"
  waste_c2_entity: "sensor.waste_collection_schedule_beda_container_2_food_waste_residual_waste_newspapers_and_colored_glass"

esphome:
  name: loftc3
  friendly_name: LoftC3
  on_boot:
    # High priority - wait for WiFi before initialising I2C sensors.
    - priority: 600
      then:
        - wait_until:
            wifi.connected:
        - logger.log: "WiFi connected, enabling environmental sensors"
        - component.update: aht10_sensor
    # Keep LCD lit briefly after boot so setup is visible.
    - priority: 200
      then:
        - lambda: |-
            id(lcd_backlight_until_ms) = millis() + 30000UL;
    - priority: -100
      then:
        - logger.log: "LoftC3 boot complete"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
      key: !secret loftc3_encryption_key

ota:
  - platform: esphome
    password: !secret loftc3_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: False
  reboot_timeout: 5min
  output_power: 8.5dbm

bluetooth_proxy:
  active: true

# Shared I2C bus for AHT20 + LCD1602 PCF8574 backpack.
# 400kHz keeps the per-frame LCD write well under 30ms so the
# component scheduler stops warning about long display ops.
i2c:
  id: loft_i2c_bus
  sda: GPIO1
  scl: GPIO2
  scan: true
  frequency: 400kHz

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Stockholm

globals:
  - id: display_page_index
    type: int
    restore_value: no
    initial_value: "0"
  - id: cal_event_titles
    type: std::vector<std::string>
    restore_value: no
  - id: cal_event_times
    type: std::vector<std::string>
    restore_value: no
  - id: cal_event_index
    type: int
    restore_value: no
    initial_value: "0"
  - id: notification_ids
    type: std::vector<std::string>
    restore_value: no
  - id: notification_titles
    type: std::vector<std::string>
    restore_value: no
  - id: notification_messages
    type: std::vector<std::string>
    restore_value: no
  - id: notification_times
    type: std::vector<std::string>
    restore_value: no
  - id: current_notification_index
    type: int
    restore_value: no
    initial_value: "0"
  - id: lcd_backlight_until_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # Dim glow after any motion pulse (walk-past), separate from full hold.
  - id: lcd_dim_until_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # Page actually drawn on the LCD. Lags display_page_index during a
  # fade-through-black so the old page stays visible while PWM falls.
  - id: lcd_drawn_page_index
    type: int
    restore_value: no
    initial_value: "0"
  # 0=idle, 1=fade out, 2=black hold, 3=fade in.
  - id: lcd_fade_phase
    type: int
    restore_value: no
    initial_value: "0"
  - id: lcd_fade_start_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: lcd_fade_from_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: lcd_pwm_applied_pct
    type: int
    restore_value: no
    initial_value: "-1"
  - id: lcd_last_advance_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: lcd_last_page_index
    type: int
    restore_value: no
    initial_value: "-1"
  # millis() when the PIR most recently went OFF -> ON. Reset to 0 by
  # the on_state handler when motion stops. The 1s "continuous motion"
  # interval below uses this to decide when to refresh the backlight
  # window.
  - id: pir_motion_start_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # BEDA indoor-bin reminder. Visible from 18:00 the evening before
  # collection until the end of collection day.
  - id: waste_due_c1
    type: bool
    restore_value: no
    initial_value: "false"
  - id: waste_due_c2
    type: bool
    restore_value: no
    initial_value: "false"
  - id: waste_today_c1
    type: bool
    restore_value: no
    initial_value: "false"
  - id: waste_today_c2
    type: bool
    restore_value: no
    initial_value: "false"
  # Button sequence: 0 idle, 1 backlight only, 2 three LED sets, 3 all loft.
  - id: loft_btn_stage
    type: int
    restore_value: no
    initial_value: "0"
  - id: loft_btn_hold_fired
    type: bool
    restore_value: no
    initial_value: "false"
  - id: loft_retry_main
    type: bool
    restore_value: no
    initial_value: "false"
  - id: loft_retry_left
    type: bool
    restore_value: no
    initial_value: "false"
  - id: loft_retry_stairs
    type: bool
    restore_value: no
    initial_value: "false"
  - id: lcd_status_until_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: lcd_status_line1
    type: std::string
    restore_value: no
  - id: lcd_status_line2
    type: std::string
    restore_value: no

# LCD backlight PWM. The PCF8574 backpack pin is held off; this GPIO
# drives the external transistor. Internal so HA area `light.turn_on`
# does not fight the PIR/slider logic.
output:
  - platform: ledc
    pin: ${backlight_pwm_pin}
    id: lcd_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: lcd_backlight_pwm
    id: lcd_backlight_light
    internal: true
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: ALWAYS_OFF

script:
  - id: loft_show_status
    parameters:
      seconds: int
    mode: restart
    then:
      - lambda: |-
          int sec = seconds;
          if (sec < 1) {
            sec = 2;
          }
          id(lcd_status_until_ms) = millis() + (uint32_t) sec * 1000UL;
          id(lcd_backlight_until_ms) =
              millis() + ${button_backlight_seconds} * 1000UL;
          id(loft_lcd_display).update();

  - id: loft_publish_cmd
    parameters:
      cmd: string
    mode: queued
    max_runs: 6
    then:
      - lambda: |-
          char buf[32];
          snprintf(buf, sizeof(buf), "%s %lu",
                   cmd.c_str(), (unsigned long) millis());
          id(loft_light_command).publish_state(buf);
          ESP_LOGI("button", "HA command %s", buf);

  - id: loft_btn_hold_watch
    mode: restart
    then:
      - delay: ${button_hold_ms}ms
      - lambda: |-
          id(loft_btn_hold_fired) = true;
          id(loft_btn_stage) = 0;
          id(lcd_status_line1) = "Lights off";
          id(lcd_status_line2) = "stairs stay";
          ESP_LOGI("button", "Hold - room lights off, stairs stay");
      - script.execute:
          id: loft_show_status
          seconds: ${lcd_status_pending_seconds}
      - script.execute: loft_room_off
      - delay: ${button_hold_stairs_extra_ms}ms
      - lambda: |-
          bool night = false;
          if (id(ha_time).now().is_valid()) {
            const int h = id(ha_time).now().hour;
            if (h < 7 || h >= 23) {
              night = true;
            } else if (id(sun_state).has_state() &&
                       id(sun_state).state == std::string("below_horizon")) {
              night = true;
            }
          }
          if (!night) {
            ESP_LOGI("button", "Hold extra - daytime, stairs stay");
            return;
          }
          id(lcd_status_line1) = "Stairs off";
          id(lcd_status_line2) = "path 30s";
          ESP_LOGI("button", "Hold extra - night stairs off + path light");
      - if:
          condition:
            lambda: |-
              if (!id(ha_time).now().is_valid()) {
                return false;
              }
              const int h = id(ha_time).now().hour;
              if (h < 7 || h >= 23) {
                return true;
              }
              return id(sun_state).has_state() &&
                     id(sun_state).state == std::string("below_horizon");
          then:
            - script.execute:
                id: loft_show_status
                seconds: ${lcd_status_success_seconds}
            - script.execute:
                id: loft_publish_cmd
                cmd: stairs_night

  - id: loft_btn_tap
    mode: queued
    max_runs: 4
    then:
      - lambda: |-
          id(lcd_backlight_until_ms) =
              millis() + ${button_backlight_seconds} * 1000UL;
      - if:
          condition:
            lambda: "return id(loft_btn_stage) <= 0;"
          then:
            - lambda: |-
                id(loft_btn_stage) = 1;
                ESP_LOGI("button", "Tap 1 - backlight %ss",
                         "${button_backlight_seconds}");
          else:
            - if:
                condition:
                  lambda: "return id(loft_btn_stage) == 1;"
                then:
                  - lambda: |-
                      id(loft_btn_stage) = 2;
                      id(lcd_status_line1) = "LEDs on";
                      id(lcd_status_line2) = "";
                      ESP_LOGI("button", "Tap 2 - three LED sets");
                  - script.execute:
                      id: loft_show_status
                      seconds: ${lcd_status_pending_seconds}
                  - script.execute: loft_leds_three_on
                else:
                  - if:
                      condition:
                        lambda: "return id(loft_btn_stage) == 2;"
                      then:
                        - lambda: |-
                            id(loft_btn_stage) = 3;
                            id(lcd_status_line1) = "All loft on";
                            id(lcd_status_line2) = "";
                            ESP_LOGI("button", "Tap 3 - all loft area lights");
                        - script.execute:
                            id: loft_show_status
                            seconds: ${lcd_status_success_seconds}
                        - script.execute: loft_leds_all_on
                      else:
                        - lambda: |-
                            id(loft_btn_stage) = 2;
                            id(lcd_status_line1) = "LEDs on";
                            id(lcd_status_line2) = "";
                            ESP_LOGI("button", "Tap - back to three LED sets");
                        - script.execute:
                            id: loft_show_status
                            seconds: ${lcd_status_success_seconds}
                        - script.execute: loft_leds_only

  - id: loft_leds_three_on
    mode: restart
    then:
      - script.execute:
          id: loft_publish_cmd
          cmd: leds_on
      - delay: ${led_retry_wait_ms}ms
      - lambda: |-
          id(loft_retry_main) = !(id(ha_light_loft_main).has_state() &&
                                  id(ha_light_loft_main).state);
          id(loft_retry_left) = !(id(ha_light_loft_left).has_state() &&
                                  id(ha_light_loft_left).state);
          id(loft_retry_stairs) = !(id(ha_light_loft_stairs).has_state() &&
                                    id(ha_light_loft_stairs).state);
          const int on_count =
              ((id(ha_light_loft_main).has_state() &&
                id(ha_light_loft_main).state) ? 1 : 0) +
              ((id(ha_light_loft_left).has_state() &&
                id(ha_light_loft_left).state) ? 1 : 0) +
              ((id(ha_light_loft_stairs).has_state() &&
                id(ha_light_loft_stairs).state) ? 1 : 0);
          char buf[17];
          snprintf(buf, sizeof(buf), "%d/3 on", on_count);
          id(lcd_status_line2) = buf;
          ESP_LOGI("button",
                   "LED check main=%s left=%s stairs=%s (retry %d%d%d)",
                   id(ha_light_loft_main).has_state()
                     ? (id(ha_light_loft_main).state ? "on" : "off") : "?",
                   id(ha_light_loft_left).has_state()
                     ? (id(ha_light_loft_left).state ? "on" : "off") : "?",
                   id(ha_light_loft_stairs).has_state()
                     ? (id(ha_light_loft_stairs).state ? "on" : "off") : "?",
                   id(loft_retry_main) ? 1 : 0,
                   id(loft_retry_left) ? 1 : 0,
                   id(loft_retry_stairs) ? 1 : 0);
      - if:
          condition:
            lambda: |-
              return id(loft_retry_main) || id(loft_retry_left) ||
                     id(loft_retry_stairs);
          then:
            - lambda: |-
                id(lcd_status_line2) = "retrying";
                ESP_LOGW("button", "Retry three LED sets");
            - script.execute:
                id: loft_show_status
                seconds: ${lcd_status_pending_seconds}
            - script.execute:
                id: loft_publish_cmd
                cmd: leds_on
            - delay: ${led_retry_wait_ms}ms
            - lambda: |-
                const int on_count =
                    ((id(ha_light_loft_main).has_state() &&
                      id(ha_light_loft_main).state) ? 1 : 0) +
                    ((id(ha_light_loft_left).has_state() &&
                      id(ha_light_loft_left).state) ? 1 : 0) +
                    ((id(ha_light_loft_stairs).has_state() &&
                      id(ha_light_loft_stairs).state) ? 1 : 0);
                char buf[17];
                snprintf(buf, sizeof(buf), "%d/3 on", on_count);
                id(lcd_status_line2) = buf;
            - script.execute:
                id: loft_show_status
                seconds: ${lcd_status_success_seconds}
          else:
            - script.execute:
                id: loft_show_status
                seconds: ${lcd_status_success_seconds}

  - id: loft_leds_all_on
    mode: restart
    then:
      - script.stop: loft_leds_three_on
      - script.execute:
          id: loft_publish_cmd
          cmd: all_on

  - id: loft_leds_only
    mode: restart
    then:
      - script.stop: loft_leds_all_on
      - script.execute:
          id: loft_publish_cmd
          cmd: leds_only

  - id: loft_room_off
    mode: restart
    then:
      - script.stop: loft_btn_tap
      - script.stop: loft_leds_three_on
      - script.stop: loft_leds_all_on
      - script.stop: loft_leds_only
      - lambda: |-
          id(loft_btn_stage) = 0;
      - script.execute:
          id: loft_publish_cmd
          cmd: room_off
      - delay: ${led_retry_wait_ms}ms
      - lambda: |-
          id(loft_retry_main) = id(ha_light_loft_main).has_state() &&
                                id(ha_light_loft_main).state;
          id(loft_retry_left) = id(ha_light_loft_left).has_state() &&
                                id(ha_light_loft_left).state;
          if (id(loft_retry_main) || id(loft_retry_left)) {
            id(lcd_status_line2) = "retrying";
            ESP_LOGW("button", "Retry room off");
          } else {
            id(lcd_status_line2) = "stairs stay";
          }
      - script.execute:
          id: loft_show_status
          seconds: ${lcd_status_success_seconds}
      - if:
          condition:
            lambda: |-
              return id(loft_retry_main) || id(loft_retry_left);
          then:
            - script.execute:
                id: loft_publish_cmd
                cmd: room_off

switch:
  - platform: restart
    name: "Loft C3 Restart"

sensor:
  # Environmental sensor.
  - platform: aht10
    id: aht10_sensor
    variant: AHT20
    i2c_id: loft_i2c_bus
    update_interval: never
    temperature:
      name: "LoftC3 Temperature"
      id: loft_aht10_temperature
      accuracy_decimals: 1
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 100.0 -> 100.0
    humidity:
      name: "LoftC3 Humidity"
      id: loft_aht10_humidity
      accuracy_decimals: 1

  # MQ2 Gas Sensor - Raw Analog Voltage.
  - platform: adc
    name: "LoftC3 MQ2 Gas/Smoke Level - Raw Analog Voltage"
    pin: GPIO0
    id: mq2_analog_raw
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 2s
    attenuation: 12db
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5

  # MQ2 Gas Sensor - Percentage (template sensor to avoid device_class conflict).
  - platform: template
    name: "LoftC3 MQ2 Gas/Smoke Level"
    id: mq2_analog
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      if (!id(mq2_analog_raw).has_state()) {
        return NAN;
      }
      float raw = id(mq2_analog_raw).state;
      if (raw != raw) {
        return NAN;
      }
      float percentage = (raw / 3.3f) * 100.0f;
      percentage = percentage - 25.0f;  // baseline offset
      if (percentage < 0.0f) {
        return 0.0f;
      }
      if (percentage > 100.0f) {
        return 100.0f;
      }
      return roundf(percentage * 10.0f) / 10.0f;

  # Outside temperature from Home Assistant for weather page.
  - platform: homeassistant
    id: outside_temperature
    entity_id: ${weather_temperature_entity}
    internal: true

  # Forecast extremes used by the weather page. Each template sensor in
  # HA must yield a number (e.g. derived from `weather.get_forecasts`).
  - platform: homeassistant
    id: forecast_today_max
    entity_id: ${forecast_today_max_entity}
    internal: true
  - platform: homeassistant
    id: forecast_tonight_min
    entity_id: ${forecast_tonight_min_entity}
    internal: true

  # Day / night brightness sliders (input_number helpers). Optional - if
  # the helpers don't exist in HA the defaults baked into the display
  # lambda (`100` for day, `0` for night) are used.
  - platform: homeassistant
    id: lcd_brightness_day
    entity_id: ${day_brightness_entity}
    internal: true
  - platform: homeassistant
    id: lcd_brightness_night
    entity_id: ${night_brightness_entity}
    internal: true

text_sensor:
  - platform: homeassistant
    id: openweathermap_condition
    entity_id: ${weather_condition_entity}
    internal: true

  # `above_horizon` / `below_horizon` - drives the night-mode decision
  # together with the 23:00 hard cap.
  - platform: homeassistant
    id: sun_state
    entity_id: ${sun_entity}
    internal: true

  # Notifications: comma-separated IDs maintained by HA automation.
  - platform: homeassistant
    id: notification_ids_csv
    entity_id: ${notification_ids_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            std::vector<std::string> old_ids = id(notification_ids);
            std::vector<std::string> old_times = id(notification_times);
            std::string csv = id(notification_ids_csv).state;
            if (csv == "unknown" || csv == "unavailable" || csv == "none") {
              csv.clear();
            }
            id(notification_ids).clear();
            id(notification_times).clear();
            if (!csv.empty()) {
              size_t start = 0;
              while (start < csv.size()) {
                size_t comma = csv.find(',', start);
                std::string part = (comma == std::string::npos)
                  ? csv.substr(start)
                  : csv.substr(start, comma - start);
                size_t a = part.find_first_not_of(" \t\r\n");
                size_t b = part.find_last_not_of(" \t\r\n");
                if (a != std::string::npos && b != std::string::npos) {
                  std::string trimmed = part.substr(a, b - a + 1);
                  if (!trimmed.empty()) {
                    id(notification_ids).push_back(trimmed);
                  }
                }
                if (comma == std::string::npos) {
                  break;
                }
                start = comma + 1;
              }
            }

            char fresh_hhmm[8] = "----";
            auto now_t = id(ha_time).now();
            if (now_t.is_valid()) {
              snprintf(
                fresh_hhmm,
                sizeof(fresh_hhmm),
                "%02d%02d",
                (int) now_t.hour,
                (int) now_t.minute
              );
            }
            for (const auto &nid : id(notification_ids)) {
              std::string captured;
              for (size_t j = 0; j < old_ids.size(); j++) {
                if (old_ids[j] == nid) {
                  if (j < old_times.size()) {
                    captured = old_times[j];
                  }
                  break;
                }
              }
              if (captured.empty()) {
                captured = std::string(fresh_hhmm);
              }
              id(notification_times).push_back(captured);
            }

            int n = (int) id(notification_ids).size();
            if (n <= 0) {
              id(current_notification_index) = 0;
            } else if (id(current_notification_index) < 0 ||
                       id(current_notification_index) >= n) {
              id(current_notification_index) = n - 1;
            }
            ESP_LOGI("notify", "IDs parsed: %d", n);

  - platform: homeassistant
    id: notification_titles_csv
    entity_id: ${notification_titles_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            // Convert any UTF-8 input to an ASCII-only string that the
            // HD44780 default character ROM (A00) can render. Swedish
            // diacritics get transliterated rather than dropped so
            // calendar / notification text stays readable.
            auto sanitize_utf8 = [](const std::string &in) -> std::string {
              std::string out;
              out.reserve(in.size());
              for (size_t i = 0; i < in.size(); ) {
                unsigned char c = (unsigned char) in[i];
                if (c < 0x80) {
                  out.push_back((char) c);
                  i++;
                  continue;
                }
                if ((c & 0xE0) == 0xC0 && i + 1 < in.size()) {
                  unsigned char c2 = (unsigned char) in[i + 1];
                  uint32_t cp = ((c & 0x1F) << 6) | (c2 & 0x3F);
                  i += 2;
                  switch (cp) {
                    case 0xC4: case 0xC5: out.push_back('A'); break;  // Ä Å
                    case 0xD6: out.push_back('O'); break;             // Ö
                    case 0xE4: case 0xE5: out.push_back('a'); break;  // ä å
                    case 0xF6: out.push_back('o'); break;             // ö
                    case 0xC9: case 0xC8: case 0xCA: out.push_back('E'); break;
                    case 0xE9: case 0xE8: case 0xEA: out.push_back('e'); break;
                    case 0xDC: out.push_back('U'); break;             // Ü
                    case 0xFC: out.push_back('u'); break;             // ü
                    case 0xD1: out.push_back('N'); break;             // Ñ
                    case 0xF1: out.push_back('n'); break;             // ñ
                    case 0xDF: out.push_back('s'); out.push_back('s'); break;  // ß
                    default: out.push_back('?'); break;
                  }
                  continue;
                }
                if ((c & 0xF0) == 0xE0 && i + 2 < in.size()) {
                  i += 3;
                  out.push_back('?');
                  continue;
                }
                if ((c & 0xF8) == 0xF0 && i + 3 < in.size()) {
                  i += 4;
                  out.push_back('?');
                  continue;
                }
                out.push_back('?');
                i++;
              }
              return out;
            };

            std::string raw = id(notification_titles_csv).state;
            if (raw == "unknown" || raw == "unavailable" || raw == "none") {
              raw.clear();
            }
            id(notification_titles).clear();
            if (!raw.empty()) {
              size_t start = 0;
              while (start < raw.size()) {
                size_t pipe = raw.find('|', start);
                std::string part = (pipe == std::string::npos)
                  ? raw.substr(start)
                  : raw.substr(start, pipe - start);
                id(notification_titles).push_back(sanitize_utf8(part));
                if (pipe == std::string::npos) {
                  break;
                }
                start = pipe + 1;
              }
            }
            ESP_LOGI("notify", "Titles parsed: %d", (int) id(notification_titles).size());

  - platform: homeassistant
