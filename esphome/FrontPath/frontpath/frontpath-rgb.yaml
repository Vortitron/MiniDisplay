# FrontPath, with the VEML6040 RGBW colour sensor in place of the TEMT6000.
#
# This is an overlay, not a fork. It pulls in frontpath.yaml unchanged as a
# package and then removes the two analogue light sensors and adds the colour
# ones. All the radar work -- the BLE parsers, the gate logic, the adaptive
# sensitivity -- stays in one place and is not duplicated here, so there is
# only ever one copy of it to maintain and no chance of the two drifting.
#
# The screen and status LED are in frontpath-display.yaml, which includes this
# file. Flash that once the panel is wired. This file remains the rollback
# without the LCD. frontpath.yaml stays as it is and remains the TEMT6000 rollback.
#
# ---------------------------------------------------------------------------
# Why colour, when intensity has never worked
# ---------------------------------------------------------------------------
#
# A path light wants to know whether the sun is going down, and a lux threshold
# cannot answer that: a dark cloud at two in the afternoon and civil twilight
# look identical to it. That is the whole reason the TEMT6000 never gave a
# usable number -- it was being asked a question it does not carry the
# information to answer.
#
# Colour does carry it. At twilight the sun is below the horizon and the sky is
# lit along a long slant path through the atmosphere, where ozone's Chappuis
# band absorbs in the orange and red: the sky goes strongly blue. That is the
# blue hour, and it is a spectral event rather than a brightness one. A cloud
# does nothing of the sort -- cloud droplets are large compared with the
# wavelength, so they scatter near-neutrally and dim the sky without much
# changing its colour.
#
# So B/R separates sunset from weather, in one number, with nothing to tune.
#
# ---------------------------------------------------------------------------
# Reading a register, and the argument that does nothing
# ---------------------------------------------------------------------------
#
# The VEML6040 wants a repeated START between the command code and the read:
# START, addr+W, command code, repeated START, addr+R, two bytes, STOP. With a
# plain STOP in the middle it never latches the command code.
#
# The obvious spelling does not work, and worse, it fails silently. In ESPHome
# 2026.9.0, i2c::I2CBus::write() takes a stop argument and then throws it away:
#
#   ErrorCode write(uint8_t address, const uint8_t *buffer, size_t len,
#                   bool stop = true) {
#     return this->write_readv(address, buffer, len, nullptr, 0);
#   }
#
# so write(..., false) and write(..., true) are the same call and both end in a
# STOP. An earlier version of this file suppressed the stop and claimed that
# was "the whole trick" -- it was toggling a dead argument.
#
# Measured, with the pointer write and the read as separate calls: a sweep of
# 0x00, 0x04, 0x05, 0x06, 0x08, 0x09, 0x0A and 0x0B returned one identical
# value for all eight, and it tracked daylight. 0x00 is the config register we
# had just written, so it should have read back the config byte. That is not a
# stuck pointer -- a stuck pointer would sit on CONF and read a constant -- it
# is the part answering every read from whatever register it defaults to.
#
# It also cleared the hardware. The board is marked VEML6040 and the chip is
# too small to read, so a wrong part was the obvious suspect; but a VEML7700,
# which has no colour channels at all, would still have returned different
# numbers for 0x04 and 0x05. Nothing that works returns one value for eight
# registers.
#
# write_readv() does the write and the read as a single transaction with the
# repeated START in the middle, which is what I2CDevice::read_register resolves
# to for every stock component.

packages:
  base: !include frontpath.yaml

substitutions:
  veml6040_address: "0x10"
  # 200 lx -> 100% Light Level, so the existing 32% darkness helper in Home
  # Assistant still means roughly 64 lx and does not need rethinking.
  veml6040_lux_full_scale: "200.0"

i2c:
  id: frontpath_i2c
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 100kHz

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: poll_veml6040

globals:
  # Integration-time index: 1 = 80 ms (bright), 5 = 1280 ms (dim).
  - id: veml_it_index
    type: int
    restore_value: no
    initial_value: '1'

  # Smoothed blue/red ratio. Dusk takes twenty minutes and a car takes two
  # seconds, so this is smoothed hard enough that headlights cannot vote.
  - id: twilight_smoothed
    type: float
    restore_value: no
    initial_value: '1.2'

script:
  - id: poll_veml6040
    then:
      - lambda: |-
          const uint8_t addr = ${veml6040_address};
          static uint32_t last_fail_log_ms = 0;
          static bool announced = false;
          auto *bus = id(frontpath_i2c);

          // CONF bits 6:4 are the integration time; bit 1 = AF (0 = auto),
          // bit 0 = SD (0 = powered on).
          static const uint8_t IT_CONF[6] = {0x00, 0x10, 0x20, 0x30, 0x40, 0x50};
          // Lux per green count, from the Vishay application note. Each step
          // doubles the integration and halves the coefficient.
          static const float IT_LUX[6] = {0.25168f, 0.12584f, 0.06292f,
                                          0.03146f, 0.01573f, 0.007865f};
          static const uint16_t COUNT_HIGH = 55000;   // nearing saturation
          static const uint16_t COUNT_LOW  = 2000;    // wasting resolution

          int it = id(veml_it_index);
          if (it < 0) it = 0;
          if (it > 5) it = 5;

          auto fail = [&](const char *why) -> void {
            uint32_t now = millis();
            if (now - last_fail_log_ms > 60000) {
              ESP_LOGW("veml6040", "%s (addr=0x%02X SDA=GPIO4 SCL=GPIO5). Check 3.3 V wiring.", why, addr);
              last_fail_log_ms = now;
            }
            id(veml_lux).publish_state(NAN);
            id(veml_twilight).publish_state(NAN);
            id(veml_greyness).publish_state(NAN);
            id(light_level).publish_state(NAN);
            id(veml_sky).publish_state("unavailable");
          };

          // Command register 0x00, then the 16-bit value little-endian. A
          // write needs no repeated start, so this one is fine as it is.
          uint8_t cmd[3] = {0x00, IT_CONF[it], 0x00};
          if (bus->write(addr, cmd, 3) != i2c::ERROR_OK) {
            fail("VEML6040 configure failed");
            return;
          }

          auto read_u16 = [&](uint8_t reg, uint16_t *out) -> bool {
            uint8_t data[2];
            // One transaction: command code, repeated START, two bytes back.
            // Split into write() then read() this silently reads the wrong
            // register -- see the note at the top of this file.
            if (bus->write_readv(addr, &reg, 1, data, 2) != i2c::ERROR_OK) return false;
            *out = (uint16_t) data[0] | ((uint16_t) data[1] << 8);
            return true;
          };

          uint16_t raw_r = 0, raw_g = 0, raw_b = 0, raw_w = 0;
          if (!read_u16(0x08, &raw_r) || !read_u16(0x09, &raw_g) ||
              !read_u16(0x0A, &raw_b) || !read_u16(0x0B, &raw_w)) {
            fail("VEML6040 read failed");
            return;
          }

          // Four registers reading exactly equal is not a colour, it is a
          // register read that is not selecting. Say so, rather than quietly
          // publishing a twilight index of 1.00 for ever.
          if (raw_r == raw_g && raw_g == raw_b && raw_b == raw_w) {
            uint32_t now = millis();
            if (now - last_fail_log_ms > 60000) {
              ESP_LOGW("veml6040",
                       "R=G=B=W=%u -- register selection is not working, so B/R means nothing.",
                       raw_r);
              last_fail_log_ms = now;
            }
          }

          const float lux = (float) raw_g * IT_LUX[it];
          float light_pct = lux / ${veml6040_lux_full_scale} * 100.0f;
          if (light_pct < 0.0f) light_pct = 0.0f;
          if (light_pct > 100.0f) light_pct = 100.0f;

          // The twilight index, straight from the counts.
          //   clear midday       ~1.2 - 1.6
          //   overcast           ~1.0 - 1.3   dim, but NOT blue
          //   civil twilight     ~1.8 - 3.0   the blue hour
          //   sodium lamp        ~0.3 - 0.6   strongly red -- which is also a
          //                                   warning: this path's own lamp
          //                                   will drag the ratio down once it
          //                                   is on, so read it before
          //                                   switching or gate on lights-off.
          if (raw_r > 8) {
            float tw_raw = (float) raw_b / (float) raw_r;
            if (tw_raw > 10.0f) tw_raw = 10.0f;
            id(twilight_smoothed) = 0.15f * tw_raw + 0.85f * id(twilight_smoothed);
          }
          const float tw = id(twilight_smoothed);

          float greyness = NAN;
          float maxc = (float) raw_r;
          if ((float) raw_g > maxc) maxc = (float) raw_g;
          if ((float) raw_b > maxc) maxc = (float) raw_b;
          float minc = (float) raw_r;
          if ((float) raw_g < minc) minc = (float) raw_g;
          if ((float) raw_b < minc) minc = (float) raw_b;
          if (maxc > 0.0f && lux >= 2.0f) greyness = (1.0f - ((maxc - minc) / maxc)) * 100.0f;

          const char *sky = "Night";
          bool is_dusk = false;
          if (lux < 1.0f) {
            sky = "Night";
          } else if (lux < 120.0f && tw >= 1.75f) {
            sky = "Twilight";          // dim AND blue: the sun is going down
            is_dusk = true;
          } else if (lux < 120.0f) {
            sky = "Dark overcast";     // dim but neutral: it is only weather
          } else if (!std::isnan(greyness) && greyness >= 75.0f) {
            sky = "Overcast";
          } else if (tw >= 1.6f) {
            sky = "Clear blue";
          } else {
            sky = "Sun";
          }

          id(veml_red).publish_state((float) raw_r);
          id(veml_green).publish_state((float) raw_g);
          id(veml_blue).publish_state((float) raw_b);
          id(veml_white).publish_state((float) raw_w);
          id(veml_lux).publish_state(lux);
          id(veml_twilight).publish_state(tw);
          id(veml_greyness).publish_state(greyness);
          id(light_level).publish_state(light_pct);
          id(veml_sky).publish_state(sky);
          id(veml_is_dusk).publish_state(is_dusk);

          // Re-range LAST. The part needs a full integration period before a
          // new setting means anything, so a read taken straight after a write
          // returns the previous conversion. Changing it at the end means the
          // next poll is ten seconds away and will be honest.
          uint16_t peak = raw_r;
          if (raw_g > peak) peak = raw_g;
          if (raw_b > peak) peak = raw_b;
          if (raw_w > peak) peak = raw_w;
          if (peak > COUNT_HIGH && it > 0) {
            id(veml_it_index) = it - 1;
            ESP_LOGI("veml6040", "Bright (peak=%u) -> integration index %d", peak, it - 1);
          } else if (peak < COUNT_LOW && it < 5) {
            id(veml_it_index) = it + 1;
            ESP_LOGI("veml6040", "Dim (peak=%u) -> integration index %d", peak, it + 1);
          }

          // At INFO while the colour read is being proved out on the path.
          // Drop to ESP_LOGD once R, G and B have been seen to differ.
          if (!announced) {
            ESP_LOGI("veml6040", "First reading R=%u G=%u B=%u W=%u lux=%.2f B/R=%.2f sky=%s",
                     raw_r, raw_g, raw_b, raw_w, lux, tw, sky);
            announced = true;
          } else {
            ESP_LOGI("veml6040", "R=%u G=%u B=%u W=%u it=%d lux=%.2f B/R=%.2f grey=%.0f%% sky=%s",
                     raw_r, raw_g, raw_b, raw_w, it, lux, tw, greyness, sky);
          }

interval:
  - interval: 10s
    then:
      - script.execute: poll_veml6040

sensor:
  # Out with the TEMT6000. Both entries go: the raw ADC voltage and the
  # template that scaled it.
  - id: !remove light_level_voltage
  - id: !remove light_level

  # In with the VEML6040. These are passive -- poll_veml6040 publishes them --
  # so update_interval is never.
  - platform: template
    name: "Illuminance"
    id: veml_lux
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: "lx"
    accuracy_decimals: 2
    icon: mdi:brightness-5
    update_interval: never

  - platform: template
    name: "Twilight Index"
    id: veml_twilight
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:weather-sunset
    update_interval: never

  - platform: template
    name: "Sky Greyness"
    id: veml_greyness
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:weather-cloudy
    update_interval: never

  # Same name and id as before, so anything in Home Assistant already keyed to
  # sensor.frontpath_light_level keeps working -- it is just fed from a sensor
  # that can actually see.
  - platform: template
    name: "Light Level"
    id: light_level
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:brightness-6
    update_interval: never

  - platform: template
    name: "Light Red"
    id: veml_red
    entity_category: diagnostic
    accuracy_decimals: 0
    icon: mdi:palette
    update_interval: never

  - platform: template
    name: "Light Green"
    id: veml_green
    entity_category: diagnostic
    accuracy_decimals: 0
    icon: mdi:palette
    update_interval: never

  - platform: template
    name: "Light Blue"
    id: veml_blue
    entity_category: diagnostic
    accuracy_decimals: 0
    icon: mdi:palette
    update_interval: never

  - platform: template
    name: "Light White"
    id: veml_white
    entity_category: diagnostic
    accuracy_decimals: 0
    icon: mdi:circle-outline
    update_interval: never

text_sensor:
  - platform: template
    name: "Sky Condition"
    id: veml_sky
    icon: mdi:weather-partly-cloudy
    update_interval: never

binary_sensor:
  # The one to drive the lights from. Dim AND blue, so a cloud at midday does
  # not switch the path on. Slow filters because dusk is slow and a false
  # trigger here is a light that comes on in the afternoon.
  - platform: template
    name: "Dusk"
    id: veml_is_dusk
    device_class: light
    filters:
      - delayed_on: 120s
      - delayed_off: 300s
