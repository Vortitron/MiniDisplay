# BedroomLights — the name is historical, and consistent: the Quiet room IS a
# bedroom, which is where this ESP32-C3 lived (hence its name, and the names
# of that room's lights, light.bedroom_light*). It moved to the BIO HALL in
# Oct 2026, where it is now:
#
#   - the bio hall's temperature and humidity (AHT20). Bio2Hvac.yaml,
#     BioThermalModel.yaml, sam.yaml and CirculationFan.yaml all read
#     sensor.bedroomlights_bedroomlights_temperature, so the device name and
#     the sensor names MUST NOT change, however wrong they sound.
#   - a Bluetooth proxy for the bio (Bermuda reads it for phone_zone).
#   - three inputs, repurposed below.
#
# 25 Oct 2026: the two latching switches and the momentary button used to
# drive the Quiet room's lights (light.bedroom_light_stand, light.bedroom_light,
# colour cycling, brightness-on-hold, and media_player.ceol_piccolo). All of
# that is gone: the device is in the wrong room for it, and those lights have
# their own BILRESA buttons in the Quiet room (BilresaQuietRoomLight.yaml,
# BilresaQuietRoomStand.yaml). About 900 lines of command/ack/guard/LED
# machinery went with it; see git history if any of it is ever wanted back.
#
# Inputs now:
#   Switch 1 (GPIO0, latching)  TOGGLES input_boolean.bio_ventilating — airing.
#     Deliberately a toggle on either direction of flip, not position-follows-
#     state: the boolean is also set from the dashboard and read by
#     Bio2Hvac.yaml, so the switch position would drift out of step. LED 1
#     shows the truth from Home Assistant, whichever way the switch sits.
#   Switch 2 (GPIO10, latching) reported to HA only, no device-side action.
#   Button  (GPIO6, momentary)  reported to HA only, no device-side action.
#     Bind either in a Home Assistant automation; nothing uses them yet.
#   LED 2 is free.
#
# Airing exists because the bio hall has two external doors. With them open
# heating warms the garden, and the thermal model's k learns nonsense from
# the 6 C/h fall, so Bio2Hvac.yaml turns Bio2 off and BioThermalModel.yaml
# stops sampling while it is on. See README_Bio2HVAC.md.

substitutions:
  led_day_on_level: '1.0'
  led_night_on_level: '0.5'

esphome:
  name: "bedroomlights"
  friendly_name: BedroomLights
  on_boot:
    # Wait for WiFi before touching I2C (this board is fussy about it).
    - priority: 600
      then:
        - wait_until:
            wifi.connected:
        - logger.log: "WiFi connected, enabling environmental sensors"
        - component.update: aht10_sensor
    # Ignore the switches' initial state publish, or a reboot would toggle
    # airing. Only flips after this point count.
    - priority: -100
      then:
        - lambda: 'id(inputs_ready) = false;'
        - delay: 10s
        - lambda: 'id(inputs_ready) = true;'
        - logger.log: "Inputs armed"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret bedroomlights_api_key

ota:
  - platform: esphome
    password: !secret bedroomlights_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  reboot_timeout: 5min

# Bluetooth Proxy (extends HA BLE range). Sits in the Bio, also feeding
# Bermuda (where people are). WiFi motion (ESPectre) was tried here
# 2026-10-07 and taken off 2026-10-17: it didn't work, and it needed most
# of the radio.
bluetooth_proxy:
  active: true

i2c:
  id: bedroom_i2c_bus
  sda: GPIO5
  scl: GPIO3
  scan: true
  frequency: 100kHz

time:
  - platform: homeassistant
    id: ha_time

interval:
  - interval: 2min
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - component.update: aht10_sensor

globals:
  - id: inputs_ready
    type: bool
    restore_value: no
    initial_value: 'false'

binary_sensor:
  # Latching Switch 1 — airing. Either direction of flip toggles it.
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bio Airing Switch"
    id: switch1
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    on_press:
      then:
        - script.execute: toggle_airing
    on_release:
      then:
        - script.execute: toggle_airing

  # Latching Switch 2 — reported to HA, nothing bound on the device.
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bio Switch 2"
    id: switch2
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms

  # Momentary button — reported to HA, nothing bound on the device.
  - platform: gpio
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bio Button"
    id: momentary_button
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms

  # The truth about airing, from Home Assistant, for LED 1.
  - platform: homeassistant
    id: airing_state
    entity_id: input_boolean.bio_ventilating
    internal: true
    on_state:
      - script.execute: sync_airing_led

sensor:
  - platform: aht10
    id: aht10_sensor
    variant: AHT20
    i2c_id: bedroom_i2c_bus
    update_interval: never  # Manual control to prevent boot-time polling
    temperature:
      name: "BedroomLights Temperature"
      id: bedroom_aht10_temperature
      accuracy_decimals: 1
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 100.0 -> 100.0
        - offset: 0.0
    humidity:
      name: "BedroomLights Humidity"
      id: bedroom_aht10_humidity
      accuracy_decimals: 1

output:
  # LED 1 — lit while airing is on.
  - platform: ledc
    pin: GPIO4
    id: switch1_led_output
    frequency: 1000Hz
  # LED 2 — free.
  - platform: ledc
    pin: GPIO7
    id: switch2_led_output
    frequency: 1000Hz

script:
  - id: toggle_airing
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(inputs_ready);'
          then:
            - logger.log: "Airing switch flipped - toggling input_boolean.bio_ventilating"
            - homeassistant.action:
                action: input_boolean.toggle
                data:
                  entity_id: input_boolean.bio_ventilating
          else:
            - logger.log: "Airing switch flip ignored (still booting)"

  - id: sync_airing_led
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          float cap = ${led_day_on_level};
          if (now.is_valid() && (now.hour >= 18 || now.hour < 6)) {
            cap = ${led_night_on_level};
          }
          bool airing = id(airing_state).state;
          id(switch1_led_output).set_level(airing ? cap : 0.0f);
          id(switch2_led_output).set_level(0.0f);
          ESP_LOGD("led", "Airing LED %s", airing ? "ON" : "off");
